# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: css-hover-in-hover-media
language: css
severity: error
message: ":hover must sit inside @media (hover: hover) and (pointer: fine); on touch a tap leaves it stuck"

rule:
  kind: pseudo_class_selector
  has:
    kind: class_name
    regex: "(?i)^hover$"
  not:
    inside:
      kind: media_statement
      regex: "(?i)\\(\\s*hover\\s*:\\s*hover\\s*\\)"
      stopBy: end

files:
  - "packages/herdr-monitor/src/**/*.css"

note: |
  Wrap hover styles: @media (hover: hover) and (pointer: fine) { .link:hover { … } }.
  :focus-visible and :active need no guard.
