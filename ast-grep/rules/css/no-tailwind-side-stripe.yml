# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-tailwind-side-stripe
language: tsx
severity: error
message: "No one-sided accent stripe from a utility class (border-l-2, border-s-4, border-l-[3px], border-l-blue-500); mark state with words, weight or a full border."

rule:
  any:
    - kind: string_fragment
    - kind: string
  # A side wider than 1px (a number, or an arbitrary px/rem/em length, fractional ones included), or a
  # side given an accent colour (a palette name or an arbitrary hex).
  regex: '(^|[\s:"])border-[lrse]-(?:[2-9]|[1-9][0-9]+|\[(?:#[^\]\s"]+|(?:[2-9]|[1-9][0-9]+|[0-9]*\.[0-9]+)(?:px)?|[0-9]*\.?[0-9]+(?:rem|em))\]|(?:red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose|primary|destructive|accent)(?:-[0-9]+)?(?:/[0-9]+)?)(?:$|[\s"])'

files:
  - "packages/**/*.tsx"

ignores:
  - "**/generated/**"
  - "repos/**"

note: |
  `lint:stripes` reads stylesheets, so a Tailwind utility class is invisible to it. The notifications
  page drew its unread marker as `border-l-2 border-l-blue-500`. Removing a side (`border-l-0`) and a
  neutral 1px divider (`border-l`, `border-l-border`) stay allowed; a side in an accent colour does not,
  even at 1px.
