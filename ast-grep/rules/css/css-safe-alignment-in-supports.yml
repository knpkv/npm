# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: css-safe-alignment-in-supports
language: css
severity: error
message: "`safe` alignment needs Chrome 115 / Safari 17.6: give the plain value first and put the `safe` one inside @supports"

rule:
  kind: declaration
  all:
    - has:
        kind: property_name
        regex: "^(justify|align|place)-(content|items|self)$"
    - has:
        kind: plain_value
        regex: "(?i)^safe$"
  # Match the condition, not the whole @supports text: a nested @supports must not excuse outer rules.
  not:
    inside:
      kind: supports_statement
      stopBy: end
      has:
        not:
          kind: block
        regex: "(?i)\\bsafe\\b"

files:
  - "packages/control-center/src/**/*.css"
  - "packages/jcf-web/src/**/*.css"
  - "packages/codecommit-web/src/**/*.css"
  - "packages/herdr-approvals/src/**/*.css"

note: |
  Vite 8 builds for chrome111 / safari16.4. Those browsers drop a `safe` alignment declaration
  entirely and fall back to `normal` (start), and lightningcss minify keeps only the last of two
  declarations, so `justify-content: center; justify-content: safe center;` ships as `safe center`
  alone. The form that survives:
    .x { justify-content: center; }
    @supports (justify-content: safe center) { .x { justify-content: safe center; } }
  A box that shrink-wraps its content cannot overflow; plain `center` is enough there.
