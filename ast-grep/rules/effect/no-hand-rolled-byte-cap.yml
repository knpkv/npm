# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-hand-rolled-byte-cap
language: tsx
severity: error
message: "Use limitBytes / collectBounded / collectBoundedText from @knpkv/bounded-io instead of counting byteLength in a stream step"

rule:
  any:
    - pattern: Stream.runFoldEffect($$$)
    - pattern: Stream.mapAccumEffect($$$)
    - pattern: Stream.mapEffect($$$)
  # A running total: something added to a chunk's byteLength. Reading one
  # chunk's size on its own is fine.
  has:
    stopBy: end
    any:
      - pattern: $TOTAL + $CHUNK.byteLength
      - pattern: $TOTAL += $CHUNK.byteLength

files:
  - "packages/*/src/**/*.ts"
  - "packages/*/src/**/*.tsx"
ignores:
  - "packages/bounded-io/src/**"
  # Caps the encoded size of assistant text while folding agent events, not a byte stream.
  - "packages/control-center/src/server/agent/internal/PrReviewTaskExecutor.ts"

note: |
  The same "fold chunks, add byteLength, fail past a cap" step was hand-copied
  into a dozen readers, each quadratic and each with its own off-by-one risk.
  @knpkv/bounded-io holds it once: limitBytes passes chunks through,
  collectBounded / collectBoundedText collect them; map ByteLimitExceeded to the
  caller's own error with catchTag.
