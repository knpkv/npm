# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: require-explicit-child-process-env-inheritance
language: tsx
severity: error
message: "Declare `extendEnv` explicitly whenever `ChildProcess.make` sets `env`"

# Both supported overloads are matched separately so the checks below apply to
# the trailing options object only. A single `$$$ARGS` pattern with `stopBy: end`
# also searched the command and argument expressions, so an unrelated nested
# object such as `[JSON.stringify({ env: payload })]` was reported.
rule:
  any:
    - pattern: ChildProcess.make($COMMAND, $ARGUMENTS, $OPTIONS)
    - pattern: ChildProcess.make($COMMAND, $OPTIONS)
    # Barrel namespace form: `import * as Process from "effect/unstable/process"`.
    - pattern: $NAMESPACE.ChildProcess.make($COMMAND, $ARGUMENTS, $OPTIONS)
    - pattern: $NAMESPACE.ChildProcess.make($COMMAND, $OPTIONS)

# `has` defaults to direct children, so these see the options object's own
# properties rather than anything nested inside a property value.
#
# Each check covers both `key: value` pairs and shorthand entries: `{ env }` is a
# `shorthand_property_identifier`, not a `pair`, so a pair-only selector missed
# `{ env }` entirely and — worse — would have reported `{ env: x, extendEnv }`
# because it could not see the shorthand `extendEnv` either.
constraints:
  OPTIONS:
    kind: object
    all:
      - any:
          - has:
              pattern:
                context: |
                  const $_ = { env: $ENV }
                selector: pair
          - has:
              pattern:
                context: |
                  const $_ = { env }
                selector: shorthand_property_identifier
      - not:
          any:
            - has:
                pattern:
                  context: |
                    const $_ = { extendEnv: $EXTEND }
                  selector: pair
            - has:
                pattern:
                  context: |
                    const $_ = { extendEnv }
                  selector: shorthand_property_identifier

files:
  - "packages/*/src/**/*.ts"
  - "packages/*/src/**/*.tsx"
  - "packages/*/scripts/**/*.ts"

note: |
  This is the fast direct-shape check. It only sees an options object written
  inline at the call, so the binding-aware local ESLint rule
  `local-rules/require-explicit-child-process-env-inheritance` owns the complete
  invariant, including namespace/named import aliases, options extracted into a
  `const` binding, and properties reaching the options object through a
  statically resolvable spread.

  `extendEnv` defaults to falsy, so passing `env` alone REPLACES the child
  environment instead of augmenting it. The child then loses `PATH` and any
  PATH-resolved executable fails with `NotFound: ChildProcess.spawn (...)`.

  Choose deliberately:
  - `extendEnv: true` to add variables on top of the inherited environment
    (required whenever the executable is resolved from `PATH`).
  - `extendEnv: false` for a reviewed isolated environment; then `env` must
    itself carry every variable the child needs, including `PATH`. See
    require-isolated-agent-child-environment, which mandates this form for
    local agent child processes.
