# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-silent-catch-all
language: tsx
severity: error
message: "Do not turn every failure into success without looking at it: fail with a typed error, log it, or recover from a named tag"

rule:
  all:
    - any:
        - all:
            - any:
                - pattern: Effect.catch(() => $BODY)
                - pattern: Effect.catch(($IGNORED) => $BODY)
                - pattern: Effect.catch($EFFECT, () => $BODY)
                - pattern: Effect.catch($EFFECT, ($IGNORED) => $BODY)
                - pattern: Effect.catchCause(() => $BODY)
                - pattern: Effect.catchCause(($IGNORED) => $BODY)
                - pattern: Effect.catchCause($EFFECT, () => $BODY)
                - pattern: Effect.catchCause($EFFECT, ($IGNORED) => $BODY)
                - pattern: Effect.catchIf(() => true, $HANDLER)
                - pattern: Effect.catchIf($EFFECT, () => true, $HANDLER)
            - has:
                any:
                  - pattern: Effect.succeed($$$VALUE)
                  - pattern: Effect.succeedNone
                  - pattern: Effect.succeedSome($$$VALUE)
                  - pattern: Effect.void
                stopBy: end
        # orElseSucceed always succeeds, so a handler that ignores the error is a silent fallback by itself.
        - pattern: Effect.orElseSucceed(() => $BODY)
        - pattern: Effect.orElseSucceed(($IGNORED) => $BODY)
        - pattern: Effect.orElseSucceed($EFFECT, () => $BODY)
        - pattern: Effect.orElseSucceed($EFFECT, ($IGNORED) => $BODY)
    - not:
        has:
          any:
            - pattern: Effect.log($$$ARGS)
            - pattern: Effect.logDebug($$$ARGS)
            - pattern: Effect.logInfo($$$ARGS)
            - pattern: Effect.logWarning($$$ARGS)
            - pattern: Effect.logError($$$ARGS)
          stopBy: end

constraints:
  IGNORED:
    regex: "^_"

files:
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "scripts/**/*.ts"

ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/generated/**"
  - "repos/**"
  - "scratchpad/**"

note: |
  A handler that never looks at the failure turns every error, including ones nobody anticipated, into
  a successful fallback. Recover from the named failure you expect, keep the failure typed, or log it:

  effect.pipe(Effect.catchTag("NotFound", () => Effect.succeed(Option.none())))
  effect.pipe(Effect.catch((error) => Effect.logWarning("Using cached list", error).pipe(Effect.as(cached))))
