# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-unowned-detached-fiber
language: tsx
severity: error
message: "Attach background fibers to an application, layer, or service scope"

rule:
  any:
    - pattern: Effect.forkDetach
    - pattern: Effect.forkDetach($$$ARGS)

files:
  - "packages/**/*.ts"
  - "packages/**/*.tsx"
  - "packages/**/*.mjs"

ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/generated/**"
  - "repos/**"

note: |
  Detached fibers attach to the global scope and survive their owning layer or
  application. Use `Effect.forkScoped` for layer workers or capture the owning
  application/service scope and use `Effect.forkIn(scope)`.

  ServerLifecycle's single line-scoped suppression is an audited shutdown
  boundary: it detaches the post-shutdown drain continuation after the
  runtime-owned main fiber has already completed. The suppression-count
  contract prevents another detach from inheriting that exception.
