# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-counted-yield-now-wait
language: tsx
severity: error
message: "Synchronize concurrent tests with Deferred, Queue, Latch, or Ref; do not guess a yield count"

rule:
  all:
    - pattern: |
        for (let $INDEX = $START; $COND; $UPDATE) {
          $$$BODY
        }
    - has:
        pattern: yield* Effect.yieldNow
        stopBy: end

files:
  - "packages/jira-clockify/test/**/*.ts"
  - "packages/jira-clockify/test/**/*.tsx"

ignores:
  - "**/generated/**"
  - "**/vendor/**"

note: A fixed scheduler-yield budget is not evidence that the other fiber reached the required state.
