# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-atlassian-cli-auth-reimplementation
language: tsx
severity: error
message: "Use makeAtlassianCliAuth from @knpkv/atlassian-common/cli-auth instead of re-implementing the CLI OAuth flow"

rule:
  any:
    # The rotating refresh-token flow (lock, atomic grant+persist, invalid_grant rule).
    - kind: import_statement
      all:
        - has:
            field: source
            regex: '^["'']@knpkv/atlassian-common/auth["'']$'
        - has:
            stopBy: end
            kind: import_specifier
            has:
              field: name
              regex: "^refreshToken$"
    # A namespace import would reach refreshToken without naming it.
    - kind: import_statement
      all:
        - has:
            field: source
            regex: '^["'']@knpkv/atlassian-common/auth["'']$'
        - has:
            stopBy: end
            kind: namespace_import
    # A product-local OAuth callback server.
    - kind: function_declaration
      has:
        field: name
        regex: "^startCallbackServer$"
    - kind: variable_declarator
      has:
        field: name
        regex: "^startCallbackServer$"

files:
  - "packages/jira-cli/src/**/*.ts"
  - "packages/jira-cli/src/**/*.tsx"
  - "packages/confluence-to-markdown/src/**/*.ts"
  - "packages/confluence-to-markdown/src/**/*.tsx"

note: |
  jira-cli and confluence-to-markdown carried two drifting ~600-line copies of
  the browser login and rotating refresh-token flow. The flow lives once in
  @knpkv/atlassian-common/cli-auth; a CLI binds it with makeAtlassianCliAuth.
  Only these two CLI implementations are covered. Other integrations may use
  the endpoint helpers or their own callback servers.
