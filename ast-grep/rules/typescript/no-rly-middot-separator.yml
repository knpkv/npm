# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-rly-middot-separator
language: tsx
severity: error
message: "UI copy must not join facts with a middot; use a comma, a phrase, or separate elements"

rule:
  any:
    - kind: jsx_text
      regex: "·"
    - kind: string_fragment
      regex: "·"

files:
  - "packages/rly/src/**/*.tsx"
  - "packages/rly/src/**/*.ts"
  - "packages/herdr-connect/src/**/*.tsx"
  - "packages/herdr-connect/src/**/*.ts"
  - "packages/herdr-approvals/src/**/*.tsx"
  - "packages/herdr-approvals/src/**/*.ts"
  - "packages/codecommit-web/src/client/**/*.tsx"
  - "packages/codecommit-web/src/client/**/*.ts"

note: |
  "A · B · C" is template chrome: it lists facts without saying how they relate. Write the facts as a
  phrase ("Agent finding, not an approval"), or lay them out as separate elements.
  Stories and packages not listed are covered by the family pass, not this rule.
