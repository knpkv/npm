# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-autocommit-sqlite-fixture-loop
language: tsx
severity: error
message: "Seed SQLite fixture rows in one transaction: a per-row autocommit write inside a loop fsyncs every row"
rule:
  kind: call_expression
  # Ordered: $DB is captured by the first entry before the exemptions use it.
  all:
    - any:
        - pattern: $DB.prepare($$$).run($$$)
        # A statement prepared earlier in the same block, e.g. `const insert = db.prepare(...)`.
        - all:
            - pattern: $STATEMENT.run($$$)
            - inside:
                any:
                  - kind: statement_block
                  - kind: program
                stopBy: end
                has:
                  pattern: const $STATEMENT = $DB.prepare($$$)
                  stopBy: end
    # The write runs once per iteration: a loop encloses it with no function in
    # between (a callback in a loop header's case list runs on its own).
    - inside:
        matches: loop
        stopBy:
          any:
            - kind: arrow_function
            - kind: function_expression
            - kind: function_declaration
            - kind: method_definition
    # Exempt at the loop that repeats the write when it opens $DB itself, or
    # while a transaction is open on $DB there: the loop follows a BEGIN on $DB
    # with no COMMIT or ROLLBACK on $DB in between, or it sits directly in a try
    # block that does, with no COMMIT or ROLLBACK on $DB before it in the block.
    - not:
        inside:
          # The nearest loop only; an outer loop's transaction state says
          # nothing about a COMMIT between it and the repeating loop.
          stopBy:
            matches: loop
          all:
            - matches: loop
            - any:
                # A connection opened in this loop writes once per connection,
                # not once per row of one connection.
                - has:
                    pattern: const $DB = $INIT
                    stopBy: end
                - follows:
                    matches: open-transaction-begin
                    stopBy:
                      matches: transaction-end
                - all:
                    - not:
                        follows:
                          matches: transaction-end
                          stopBy: end
                    - inside:
                        kind: statement_block
                        inside:
                          kind: try_statement
                          follows:
                            matches: open-transaction-begin
                            stopBy:
                              matches: transaction-end
    # A transaction helper that receives this same connection.
    - not:
        inside:
          kind: call_expression
          all:
            - has:
                field: function
                regex: "[Tt]ransaction"
            - has:
                field: arguments
                has:
                  pattern: $DB
          stopBy: end

utils:
  loop:
    any:
      - kind: for_statement
      # for...of and for...in
      - kind: for_in_statement
      - kind: while_statement
      - kind: do_statement
  open-transaction-begin:
    kind: expression_statement
    has:
      pattern: $DB.exec($$$)
      # BEGIN [DEFERRED|IMMEDIATE|EXCLUSIVE] as a statement; a trigger body's BEGIN is not one.
      regex: "(?is)\\.exec\\(.*\\bBEGIN(\\s+(DEFERRED|IMMEDIATE|EXCLUSIVE))?\\s*(;|[`\"'])"
  transaction-end:
    kind: expression_statement
    has:
      pattern: $DB.exec($$$)
      regex: "(?is)\\.exec\\(.*\\b(COMMIT|ROLLBACK)\\s*(;|[`\"'])"

files:
  - "packages/*/test/**/*.ts"
  - "packages/*/test/**/*.tsx"

note: |
  Each autocommit write to a file-backed SQLite database waits for its own
  fsync, so a few hundred seeded rows can cost seconds and the test's runtime
  follows disk latency instead of the code under test (herdr-work and
  herdr-coordinator migration tests timed out in CI this way). Wrap the loop in
  `database.exec("BEGIN")` ... `database.exec("COMMIT")`, or in a transaction
  helper that receives the same connection. A loop that opens its own
  connection (one database copy per case) is exempt; reopening the same file
  once per row would also pass, which syntax cannot tell apart. Branches and
  aliased connections are not tracked. Source code is out of scope: a per-row
  durable commit there may be intentional.
