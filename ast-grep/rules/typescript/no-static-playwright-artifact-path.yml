# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-static-playwright-artifact-path
language: tsx
severity: error
message: "Write Playwright artifacts under testInfo.outputPath(...), not a fixed test-results path"
rule:
  kind: pair
  has:
    field: key
    regex: "^path$"
  all:
    - has:
        field: value
        any:
          - kind: string
          - kind: template_string
        regex: "^[\"'`](\\./)?test-results/"

files:
  - "packages/*/e2e/**/*.ts"
  - "packages/*/e2e/**/*.tsx"
  - "packages/*/visual/**/*.ts"
  - "packages/*/visual/**/*.tsx"
  - "packages/*/test/browser/**/*.ts"
  - "packages/*/test/browser/**/*.tsx"

note: |
  Playwright gives each run its own output directory (`outputDir`), so two
  copies of a suite can run at once. A fixed `test-results/...` path is shared
  by every run: concurrent runs overwrite each other's file, and a stale file
  from an earlier run survives because Playwright only cleans `outputDir`. Use
  `testInfo.outputPath("name.png")`. For a deliberately shared golden file,
  suppress with `// ast-grep-ignore: no-static-playwright-artifact-path` and a reason.
