# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-inline-aws-credential-error-tags
language: tsx
severity: error
message: "Classify expired or rejected AWS credentials with isCredentialInvalidCause, not an inline tag list"

rule:
  any:
    - pattern: '"UnrecognizedClientException"'
    - pattern: '"InvalidClientTokenId"'

files:
  - "packages/**/src/**/*.ts"
  - "packages/**/src/**/*.tsx"

ignores:
  - "packages/codecommit-core/src/AwsCredentialErrors.ts"
  - "packages/codecommit-core/src/ReviewClient/errors.ts"
  - "**/generated/**"

note: |
  Three adapters once kept their own lists of credential-failure tags and disagreed about which
  failures meant "sign in again". Import isCredentialInvalidCause from
  `@knpkv/codecommit-core/AwsCredentialErrors.js`. ReviewClient/errors.ts is exempt because it enumerates
  every provider error code for decoding, not for classification.
