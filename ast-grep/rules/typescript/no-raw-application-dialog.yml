# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-raw-application-dialog
language: tsx
severity: error
message: "Control Center dialogs must use the shared rly Dialog primitive"

rule:
  any:
    - all:
        - kind: jsx_attribute
        - has:
            kind: property_identifier
            regex: "^role$"
        - has:
            stopBy: end
            kind: string_fragment
            regex: "^dialog$"
    - all:
        - kind: jsx_attribute
        - has:
            kind: property_identifier
            regex: "^aria-modal$"
        - any:
            - has:
                stopBy: end
                kind: string_fragment
                regex: "^true$"
            - has:
                stopBy: end
                kind: "true"
    - pattern:
        context: "<div aria-modal />"
        selector: jsx_attribute
        strictness: ast

files:
  - "packages/control-center/src/client/**/*.tsx"

ignores:
  - "**/generated/**"
  - "repos/**"

note: |
  The shared rly Dialog primitive owns portal isolation, focus containment,
  dismissal, focus restoration, scroll locking, nesting, and reduced motion.
  Third-party wrappers require a narrow documented ignore rather than another
  application-owned modal lifecycle.
