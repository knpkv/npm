# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-raw-application-dialog
language: tsx
severity: error
message: "Control Center dialogs must use the shared rly Dialog primitive"

rule:
  any:
    - pattern:
        context: "<dialog $$$ATTRIBUTES />"
        selector: jsx_self_closing_element
        strictness: ast
    - pattern:
        context: "<dialog $$$ATTRIBUTES>$$$CHILDREN</dialog>"
        selector: jsx_element
        strictness: ast
    - pattern:
        context: '<div role="dialog" />'
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: '<div role={"dialog"} />'
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: '<div role={"dialog" as const} />'
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: "<div role={`dialog`} />"
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: '<div role="alertdialog" />'
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: '<div role={"alertdialog"} />'
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: '<div role={"alertdialog" as const} />'
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: "<div role={`alertdialog`} />"
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: '<div aria-modal="true" />'
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: '<div aria-modal={"true"} />'
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: "<div aria-modal={`true`} />"
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: "<div aria-modal={true} />"
        selector: jsx_attribute
        strictness: ast
    - pattern:
        context: "<div aria-modal />"
        selector: jsx_attribute
        strictness: ast

files:
  - "packages/control-center/src/client/**/*.tsx"

ignores:
  - "**/generated/**"
  - "repos/**"

note: |
  The shared rly Dialog primitive owns portal isolation, focus containment,
  dismissal, focus restoration, scroll locking, nesting, and reduced motion.
  Third-party wrappers require a narrow documented ignore rather than another
  application-owned modal lifecycle.
