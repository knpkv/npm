id: use-effect-fn-for-named-effect-functions
valid:
  - |
    const load = Effect.fn("Feature.load")(function*(id: Id) {
      return yield* repository.load(id)
    })
  - |
    handlers.handle("load", (id) => Effect.gen(function*() {
      return yield* repository.load(id)
    }))
  - |
    const pure = (value: number): number => value + 1
  - |
    const identity = <Value,>(value: Value): Value => value
  - |
    const load = Effect.fn("Feature.load")(function*<Value>(value: Value) {
      return yield* Effect.succeed(value)
    })
  - |
    const fetchJson = Effect.fn("Feature.fetchJson")(function*<A>(schema: Schema.Codec<A>) {
      return yield* Schema.decodeUnknownEffect(schema)({})
    })
  - |
    const publish = Effect.fn("Feature.publish")(function*<Failure, Requirements>(value: string) {
      return yield* Effect.uninterruptibleMask(() => Effect.succeed(value))
    })
  - |
    Effect.uninterruptibleMask(() => Effect.succeed("anonymous callback"))
  - |
    const collectOpen: FilterServiceContract["collectOpen"] = Effect.fn("FilterService.collectOpen")(
      (targets, opts) =>
        fanOut(targets, opts).pipe(Effect.map(({ prs }) => ({ prs })))
    )
  - |
    const scan: PrOpenServiceContract["scan"] = Effect.fn("PrOpenService.scan")((input) =>
      source(input).pipe(Effect.map(({ prs }) => ({ prs })))
    )
  - |
    const gitOutput = Effect.fn("GitContextService.gitOutput")((path, args) =>
      spawner.string(command(path, args)).pipe(Effect.map((output) => output.trim()))
    )
  - |
    const collect: FilterServiceContract["collect"] = Effect.fn("FilterService.collect")((targets) =>
      Effect.gen(function*() {
        return yield* fanOut(targets)
      })
    )
  - |
    const collectMatching = Effect.fn("PrListService.collectMatching")((stream) =>
      stream.pipe(Stream.filter(keep), Stream.runCollect, Effect.map(Array.from))
    )
  - |
    class Store {
      readonly put = Effect.fn("Store.put")(function*(value: string) {
        return yield* Effect.succeed(value)
      })
      close(): void {}
    }
