id: css-no-outline-none
valid:
  - |
    @media (width < 48rem) { @media (forced-colors: active) { .b { outline: none; } } }
  - |
    .x:focus-visible { outline: var(--rly-focus-ring-width) solid transparent; }
  - |
    @media (forced-colors: active) { .x { outline: none; } }
  - |
    .x { outline-offset: 0; }
invalid:
  - |
    .usage-column-target { outline: none; }
  - |
    .x:focus:not(:focus-visible) { outline: 0; }
  - |
    .x { outline-style: none; }
  - |
    @media (width < 48rem) { .a { outline: none; } @media (forced-colors: active) { .b { outline: none; } } }
