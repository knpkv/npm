id: no-raw-application-dialog
valid:
  - |
    <Dialog.Root>
      <Dialog.Content title="Review">Content</Dialog.Content>
    </Dialog.Root>
  - |
    <div role="status">Review complete</div>
  - |
    <div role={dialogRole} aria-modal={isModal}>
      Dynamic third-party wrapper
    </div>
  - |
    <div aria-modal={false}>Non-modal content</div>
  - |
    <div role={"dialog".length === 6 ? "status" : "alert"}>
      Status
    </div>
  - |
    <div aria-modal={"true".length === 4 ? false : false}>
      Non-modal content
    </div>
invalid:
  - |
    <div aria-modal="true" role="dialog">
      Review
    </div>
  - |
    <section aria-modal="true">
      Review
    </section>
  - |
    <div role='dialog'>Review</div>
  - |
    <div role={"dialog"}>Review</div>
  - |
    <div role={'dialog'}>Review</div>
  - |
    <aside aria-modal={"true"}>Review</aside>
  - |
    <aside aria-modal={'true'}>Review</aside>
  - |
    <aside aria-modal={true}>Review</aside>
  - |
    <div aria-modal>Review</div>
  - |
    <div role={`dialog`}>Review</div>
  - |
    <div aria-modal={`true`}>Review</div>
