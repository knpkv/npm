  ? |
    stream.pipe(Stream.runFoldEffect(() => ({ bytes: 0, chunks: [] }), (output, chunk) => {
      const bytes = output.bytes + chunk.byteLength
      return bytes > max ? Effect.fail(new TooLarge()) : Effect.succeed({ bytes, chunks: [...output.chunks, chunk] })
    }))
