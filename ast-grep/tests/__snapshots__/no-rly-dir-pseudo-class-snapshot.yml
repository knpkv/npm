id: no-rly-dir-pseudo-class
snapshots:
  ? |
    .button[aria-expanded="false"] .chevron:dir(rtl) { transform: rotate(45deg); }
  : labels:
      - source: .button[aria-expanded="false"] .chevron:dir(rtl)
        style: primary
        start: 0
        end: 48
      - source: dir
        style: secondary
        start: 40
        end: 43
  ? |
    .chevron:dir(rtl) { transform: rotate(-45deg); }
  : labels:
      - source: .chevron:dir(rtl)
        style: primary
        start: 0
        end: 17
      - source: dir
        style: secondary
        start: 9
        end: 12
