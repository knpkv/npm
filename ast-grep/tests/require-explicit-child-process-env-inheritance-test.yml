id: require-explicit-child-process-env-inheritance
valid:
  - |
    ChildProcess.make("assume", ["-cd", link, profile], {
      stdout: "inherit",
      env: { GRANTED_ALIAS_CONFIGURED: "true" },
      extendEnv: true
    })
  - |
    ChildProcess.make("git", args, {
      env: gitEnvironment,
      extendEnv: false
    })
  - |
    ChildProcess.make("aws", ["sso", "login", "--profile", profile], {
      stdout: "inherit",
      stderr: "inherit"
    })
  - |
    ChildProcess.make("pbcopy", { stdin })
  - |
    ChildProcess.make("open", [url])
  - |
    ChildProcess.make("tool", [JSON.stringify({ env: payload })], {
      stderr: "pipe"
    })
  - |
    ChildProcess.make("tool", [JSON.stringify({ extendEnv: true })], {
      env: childEnv,
      extendEnv: true
    })
  - |
    ChildProcess.make("git", args, { env, extendEnv })
  - |
    ChildProcess.make("git", args, { env: childEnv, extendEnv })
  - |
    ChildProcess.make("git", args, { env, extendEnv: true })
  - |
    ChildProcess.make("pbcopy", { env, extendEnv })
  - |
    Process.ChildProcess.make("git", args, { env, extendEnv: true })
invalid:
  - |
    ChildProcess.make("assume", ["-cd", link, profile], {
      stdout: "inherit",
      env: { GRANTED_ALIAS_CONFIGURED: "true" }
    })
  - |
    ChildProcess.make("node", [CLI_PATH, ...args], {
      env: { PATH: path }
    })
  - |
    ChildProcess.make("pbcopy", { env: childEnv, stdin })
  - |
    ChildProcess.make("tool", [JSON.stringify({ extendEnv: true })], {
      env: childEnv
    })
  - |
    ChildProcess.make("git", args, { env })
  - |
    ChildProcess.make("git", args, { env, stderr: "pipe" })
  - |
    ChildProcess.make("pbcopy", { env })
  - |
    Process.ChildProcess.make("git", args, { env })
