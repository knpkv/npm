id: css-hover-in-hover-media
valid:
  - |
    @media (width < 48rem) { @media (hover: hover) and (pointer: fine) { .b:hover { color: red; } } }
  - |
    @media (hover: hover) and (pointer: fine) { .nav a:hover { text-decoration: underline; } }
  - |
    .x:focus-visible { outline: 2px solid; }
  - |
    @media (hover: hover) { .x:hover input { border-color: red; } }
invalid:
  - |
    .review-nav li a:hover { text-decoration: underline; }
  - |
    .review-checkbox:hover input { border-color: red; }
  - |
    @media (pointer: fine) { .x:hover { color: red; } }
  - |
    @media (width < 48rem) { .a:hover { color: red; } @media (hover: hover) { .b:hover { color: red; } } }
