id: no-inline-aws-credential-error-tags
valid:
  - "isCredentialInvalidCause(error.cause)"
  - 'hasTag(cause, ["CredentialsProviderError"])'
invalid:
  - 'causeHasTag(error.cause, ["InvalidClientTokenId", "UnrecognizedClientException", "ExpiredTokenException"])'
  - 'hasAwsTag(cause, ["UnrecognizedClientException"])'
