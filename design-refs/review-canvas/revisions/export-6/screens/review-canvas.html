<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code, PR review canvas</title>
<link rel="stylesheet" href="rly.css">
<link rel="stylesheet" href="chrome.css">
<script src="relay-chef-modern.js"></script>
<script src="relay-creature-states.js"></script>
<script src="relay-screen-art.js"></script>
<style>
@font-face { font-display: block; font-family: "Geist Variable"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-variable.woff2") format("woff2-variations"), url("fonts/geist-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-variable.woff2") format("woff2-variations"), url("fonts/geist-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist Mono Variable"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-mono-variable.woff2") format("woff2-variations"), url("fonts/geist-mono-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-mono-variable.woff2") format("woff2-variations"), url("fonts/geist-mono-variable.woff2") format("woff2"); }
html, body { margin: 0; }
body { font: 430 1rem/1.5 var(--rly-font-ui); color: var(--rly-color-text-1); background: var(--rly-color-canvas); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--rly-color-text-1); }
button { font: inherit; }
code, .mono { font-family: var(--rly-font-mono); }
.sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.fail { padding: 2rem; display: grid; gap: .75rem; max-inline-size: 40em; }
.fail h1 { margin: 0; font-size: 2rem; font-weight: 620; letter-spacing: -0.03em; }
.fail p { margin: 0; color: var(--rly-color-text-2); }
.fail code { font: 430 .875rem/1.4 var(--rly-font-mono); color: var(--rly-color-text-1); }
.pb { font: 650 .6875rem/1 var(--rly-font-mono); padding: 2px 4px; border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-tag); background: var(--rly-color-surface-1); white-space: nowrap; }
.kbd { font: 430 .75rem/1 var(--rly-font-mono); padding: 2px 5px; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-tag); color: var(--rly-color-text-2); }
.mk { display: flex; gap: 4px; align-items: center; }
.muted { color: var(--rly-color-text-2); }

/* Desktop */
.prhead { padding: 20px 40px 10px; display: grid; gap: 8px; }
.prhead .crumbs { display: flex; gap: .6rem; align-items: center; font-size: .875rem; color: var(--rly-color-text-2); }
.prhead .crumbs a { text-decoration: underline; text-underline-offset: .2em; }
.prhead .repo { font: 520 .8125rem/1.3 var(--rly-font-mono); color: var(--rly-color-text-2); }
.prhead h1 { margin: 0; font-size: 2rem; font-weight: 620; letter-spacing: -0.03em; line-height: 1.15; }
.prhead .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: .875rem; color: var(--rly-color-text-2); }
.prhead .meta > span { flex: none; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.prhead .meta code { color: var(--rly-color-text-1); }
.tabsrow { padding: 8px 20px 0; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg2 { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-control); background: var(--rly-color-surface-1); }
.seg2 button { display: inline-flex; gap: .45rem; align-items: center; min-block-size: 36px; padding-inline: .8rem; font-size: .875rem; color: var(--rly-color-text-2); background: transparent; border: 0; border-radius: calc(var(--rly-radius-control) - 2px); }
.seg2 button[aria-pressed="true"] { font-weight: 620; color: var(--rly-color-text-1); background: var(--rly-color-surface-3); }
.seg2 .kbd { margin-inline: 4px 6px; }
.toolbar { padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.ladder { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-control); background: var(--rly-color-surface-1); }
.ladder button { display: inline-flex; gap: 6px; align-items: center; min-block-size: 32px; padding-inline: .6rem; font-size: .8125rem; color: var(--rly-color-text-2); background: transparent; border: 0; border-radius: calc(var(--rly-radius-control) - 2px); }
.ladder button[aria-current="true"] { font-weight: 620; color: var(--rly-color-text-1); background: var(--rly-color-surface-3); }
.ladder button[aria-disabled="true"] { color: var(--rly-color-text-3); }
.ladder .n { font: 430 .6875rem/1 var(--rly-font-mono); color: var(--rly-color-text-2); }
.levelline { font-size: .8125rem; }
.search { display: flex; gap: .5rem; align-items: center; inline-size: 300px; min-block-size: 40px; box-sizing: border-box; padding-inline: .75rem .5rem; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-field); background: var(--rly-color-surface-1); }
.search input { flex: 1; min-inline-size: 0; border: 0; background: transparent; color: inherit; font: 430 .875rem/1.2 var(--rly-font-ui); outline: none; }
.sinceline { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; font-size: .875rem; color: var(--rly-color-text-2); }
.notice-wrap { padding: 0 20px 10px; }
.docwrap { padding: 0 20px 12px; }
.doc { inline-size: 100%; max-inline-size: 1016px; box-sizing: border-box; display: grid; gap: 12px; padding: 16px 18px; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); }
.doc-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.doc-head h2 { margin: 0; font-size: 1.125rem; font-weight: 620; }
.doc-head .meta { margin-inline-start: auto; font-size: .8125rem; color: var(--rly-color-text-2); }
.doc p.lead { margin: 0; font-size: .9375rem; }
.doc .cols { column-gap: 24px; }
.sec { display: grid; gap: 6px; align-content: start; break-inside: avoid; margin-block-end: 12px; }
.sec h3 { margin: 0; font-size: .875rem; font-weight: 620; }
.sec ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.sec li { display: grid; gap: 4px; font-size: .875rem; }
.sec li .t { display: flex; gap: 8px; align-items: baseline; }
.cites { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.cite { display: inline-flex; align-items: center; font: 430 .75rem/1.35 var(--rly-font-mono); padding: 1px 6px; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-tag); color: var(--rly-color-text-2); overflow-wrap: anywhere; }
.doc .foot { margin: 0; padding-block-start: 10px; border-block-start: 1px solid var(--rly-color-border-1); display: flex; gap: 6px; align-items: center; font-size: .8125rem; color: var(--rly-color-text-2); }
.cvwrap { padding: 0 20px 24px; display: grid; gap: 8px; min-inline-size: 0; }
.cvscroll { overflow: hidden; }
.cvfit { transform-origin: 0 0; }
.cv { position: relative; inline-size: 1016px; overflow: clip; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); background: radial-gradient(circle, var(--rly-color-border-1) 1px, transparent 1.2px) 0 0 / 20px 20px, var(--rly-color-canvas); }
.cv > * { position: absolute; }
.edges { inset: 0; pointer-events: none; overflow: visible; }
.region { border-radius: 20px; background: var(--rly-color-surface-2); border: 1px solid var(--rly-color-border-1); }
.region > span { position: absolute; left: 12px; top: 8px; display: flex; gap: 8px; align-items: baseline; font-size: .75rem; color: var(--rly-color-text-2); }
.region b { font: 620 .8125rem/1.2 var(--rly-font-mono); color: var(--rly-color-text-1); }
.band { pointer-events: none; border: 1.5px dashed var(--rly-color-text-2); border-radius: 14px; }
.band > span { position: absolute; display: flex; gap: 6px; align-items: center; padding: 1px 8px; font-size: .75rem; white-space: nowrap; background: var(--rly-color-canvas); border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-tag); }
.band b { font: 650 .75rem/1.4 var(--rly-font-mono); }
.stopn { display: grid; place-items: center; inline-size: 18px; block-size: 18px; border-radius: 50%; font: 650 .6875rem/1 var(--rly-font-mono); color: var(--rly-color-canvas); background: var(--rly-color-text-1); }
.hl { box-sizing: border-box; border-radius: 12px; }
.hl > span { position: absolute; left: 6px; display: flex; gap: 4px; align-items: center; padding: 0 6px; font-size: .6875rem; line-height: 16px; white-space: nowrap; background: var(--rly-color-canvas); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-tag); }
.ctxn { block-size: 44px; box-sizing: border-box; display: grid; align-content: center; gap: 1px; padding: 3px 8px; border: 1px dashed var(--rly-color-border-2); border-radius: var(--rly-radius-control); color: var(--rly-color-text-2); font: 430 .6875rem/1.4 var(--rly-font-ui); }
.ctxn .nm { display: flex; gap: 6px; align-items: center; min-inline-size: 0; }
.ctxn .nm span, .ctxn .ln span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctxn .nm span { font: 520 .6875rem/1.4 var(--rly-font-mono); }
.ctxn .ln { display: flex; gap: 4px; align-items: center; min-inline-size: 0; }
.elabel { transform: translate(-50%, -50%); padding: 1px 6px; font-size: .6875rem; line-height: 1.4; white-space: nowrap; background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-tag); }
.nd { box-sizing: border-box; display: grid; gap: 1px; align-content: start; padding: 6px 8px; text-align: start; color: var(--rly-color-text-1); background: var(--rly-color-surface-1); border-radius: var(--rly-radius-control); outline-offset: 3px; font: 430 .6875rem/1.35 var(--rly-font-ui); }
.nd .nm { font: 560 .6875rem/1.4 var(--rly-font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nd .badges { position: absolute; inset-block-start: -9px; inset-inline-end: 6px; display: flex; gap: 3px; }
.stop { inline-size: 20px; block-size: 20px; box-sizing: border-box; display: grid; place-items: center; border-radius: 50%; font: 650 .6875rem/1 var(--rly-font-mono); border: 1.5px solid var(--rly-color-text-1); }
.col { box-sizing: border-box; border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); }
.col .hd { padding: 7px 10px; display: grid; gap: 1px; font-size: .75rem; color: var(--rly-color-text-2); }
.col .hd b { font: 620 .8125rem/1.3 var(--rly-font-mono); color: var(--rly-color-text-1); }
.chip { position: absolute; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; justify-content: space-between; min-block-size: 30px; box-sizing: border-box; padding: 4px 8px; border-radius: var(--rly-radius-control); background: var(--rly-color-surface-2); font-size: .75rem; }
.note { box-sizing: border-box; display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); font-size: .8125rem; }
.box { box-sizing: border-box; display: grid; align-content: start; background: var(--rly-color-surface-1); border-radius: var(--rly-radius-group); }
.box .hd { block-size: 52px; box-sizing: border-box; padding: 7px 10px 0; display: grid; gap: 2px; }
.box .hd b { font: 620 .8125rem/1.3 var(--rly-font-mono); }
.box .hd > span { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: .75rem; color: var(--rly-color-text-2); }
.fn { block-size: 34px; margin: 0 6px 4px; padding-inline: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; border-radius: var(--rly-radius-tag); background: var(--rly-color-surface-2); font-size: .75rem; }
.fn code { font: 520 .8125rem/1.2 var(--rly-font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fn .ln { font: 430 .75rem/1 var(--rly-font-mono); color: var(--rly-color-text-2); }
.stub { box-sizing: border-box; display: grid; gap: 1px; padding: 6px 9px; border: 1px dashed var(--rly-color-border-2); border-radius: var(--rly-radius-control); background: var(--rly-color-canvas); font-size: .6875rem; color: var(--rly-color-text-2); }
.stub b { font: 520 .75rem/1.35 var(--rly-font-mono); color: var(--rly-color-text-1); }
.fz { left: 230px; top: 72px; inline-size: 520px; box-sizing: border-box; display: grid; align-content: start; padding-block-end: 6px; background: var(--rly-color-surface-1); border: 2px solid var(--rly-color-text-1); border-radius: var(--rly-radius-group); }
.fz .hd { block-size: 48px; box-sizing: border-box; padding: 8px 14px 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: .8125rem; color: var(--rly-color-text-2); }
.fz .hd b { font: 620 .9375rem/1.3 var(--rly-font-mono); color: var(--rly-color-text-1); }
.fzr { block-size: 44px; box-sizing: border-box; margin-inline: 8px; padding-inline: 8px; display: grid; grid-template-columns: 112px minmax(0, 1fr) 72px 36px 104px; gap: 8px; align-items: center; border-block-start: 1px solid var(--rly-color-border-1); font-size: .8125rem; }
.fzr code { font: 560 .8125rem/1.2 var(--rly-font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fzr .k { color: var(--rly-color-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { block-size: 8px; border-radius: 4px; background: var(--rly-color-surface-3); }
.bar span { display: block; block-size: 8px; box-sizing: border-box; border-radius: 4px; }
.fzf { block-size: 120px; box-sizing: border-box; margin: 0 14px 8px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-field); background: var(--rly-color-surface-2); }
.fzf .t { font-size: .9375rem; font-weight: 620; }
.small { font-size: .75rem; color: var(--rly-color-text-2); }
.dz { left: 120px; top: 64px; inline-size: 700px; box-sizing: border-box; display: grid; align-content: start; background: var(--rly-color-surface-1); border: 2px solid var(--rly-color-text-1); border-radius: var(--rly-radius-group); overflow: clip; }
.dz .hd { padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; border-block-end: 1px solid var(--rly-color-border-1); }
.dz .hd b { font: 620 .875rem/1.3 var(--rly-font-mono); }
.dl { block-size: 24px; display: grid; grid-template-columns: 52px 18px minmax(0, 1fr); align-items: center; font: 430 .8125rem/24px var(--rly-font-mono); background: var(--rly-color-success-tint); }
.dl .no { text-align: end; padding-inline-end: 10px; color: var(--rly-color-text-2); }
.dl .c { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.fcard { margin: 8px 12px; padding: 12px 14px; display: grid; gap: 6px; border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); font-size: .875rem; }
.fcard .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.fcard .t { font-size: 1rem; font-weight: 620; }
.bl { left: 12px; top: 64px; inline-size: 300px; block-size: 564px; box-sizing: border-box; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 4px; padding: 10px; background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); }
.bl ul { margin: 0; padding: 0; list-style: none; display: grid; align-content: start; }
.bl li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; block-size: 32px; padding-inline: 6px; border-block-start: 1px solid var(--rly-color-border-1); font-size: .75rem; }
.bl li a { font: 520 .75rem/1.2 var(--rly-font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel { box-sizing: border-box; display: grid; gap: 8px; padding: 10px 12px; background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-group); font-size: .75rem; }
.panel > b { font-size: .8125rem; font-weight: 620; }
.panel .pr { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; align-items: start; }
.panel .pbar { display: block; margin-inline-start: 20px; block-size: 6px; border-radius: 3px; background: var(--rly-color-surface-3); }
.panel .pbar span { display: block; block-size: 6px; border-radius: 3px; background: var(--rly-color-text-1); }
.keyrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; }
.keyrow > span:first-child { display: flex; gap: 3px; flex-wrap: wrap; }
.legend { left: 12px; bottom: 12px; inline-size: 324px; box-sizing: border-box; display: grid; gap: 3px; padding: 8px 12px; background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); font-size: .75rem; }
.legend > b { font-size: .8125rem; font-weight: 620; }
.legend > span { display: flex; gap: 8px; align-items: center; }
.sw { flex: none; inline-size: 14px; block-size: 10px; border-radius: 3px; }
.ln22 { flex: none; inline-size: 22px; }
.minimap { right: 12px; bottom: 12px; inline-size: 168px; box-sizing: border-box; padding: 6px; display: grid; gap: 4px; background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-field); font-size: .6875rem; color: var(--rly-color-text-2); }
.minimap svg { display: block; inline-size: 100%; block-size: auto; }
.sheet { z-index: 3; box-sizing: border-box; display: grid; gap: 10px; padding: 14px 16px; background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-group); }
.sheet h2 { margin: 0; font: 620 1rem/1.3 var(--rly-font-mono); }
.status { display: flex; gap: 8px; align-items: center; min-block-size: 32px; font-size: .8125rem; color: var(--rly-color-text-2); }
.linear { box-sizing: border-box; display: grid; gap: 14px; padding: 16px 20px; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); max-inline-size: 1016px; }
.linear > div:first-child { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.linear h2 { margin: 0; font-size: 1.125rem; font-weight: 620; }
.linear ol { margin: 0; padding: 0; list-style: none; }
.chap { display: grid; gap: 8px; }
.chap h3 { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 1rem; font-weight: 620; }
.chap h3 span + span { font-size: .8125rem; font-weight: 430; color: var(--rly-color-text-2); }
.lfiles { display: grid; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-field); }
.lfile { display: grid; gap: 4px; padding: 8px 12px; }
.lfile + .lfile { border-block-start: 1px solid var(--rly-color-border-1); }
.lfile .hd { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.lfile .hd code { font: 560 .875rem/1.3 var(--rly-font-mono); }
.lfile ul { margin: 0; padding: 0 0 0 28px; list-style: none; display: grid; gap: 2px; }
.hunk { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; min-block-size: 26px; padding: 2px 8px; font-size: .8125rem; border-radius: var(--rly-radius-tag); }
.hunk[aria-current="true"] { background: var(--rly-color-surface-2); outline: 2px solid var(--rly-color-focus); outline-offset: 1px; }
.hunk code { font: 520 .8125rem/1.3 var(--rly-font-mono); }

/* Sections 4–6 */
.dockgrid { display: grid; grid-template-columns: minmax(0, 600fr) minmax(320px, 385fr); gap: 16px; align-items: start; padding: 0 20px 24px; }
.dockgrid .cvwrap { padding: 0; }
@media (max-width: 899px) { .dockgrid { grid-template-columns: minmax(0, 1fr); } }
.dk { display: grid; gap: 12px; min-inline-size: 0; }
.dk h2 { margin: 0; font-size: 1.125rem; font-weight: 620; }
.row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.bx { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); }
.bx h3 { margin: 0; font-size: .8125rem; font-weight: 620; color: var(--rly-color-text-2); }
.bx blockquote { margin: 0; font-size: .9375rem; }

  const V46 = ["soReady", "soStep", "soBlocked", "fsPreview", "fsItem", "fsEdit", "fsSent", "rcWait", "fsCompare", "setA", "setB", "ckSuggest", "ckFlip", "ckPost", "ckRc"];

    if (V.settings) return `<div class="shell">${nav}<div class="work">${header}<main>${settingsHtml(M, V.settings, false)}</main></div></div>`;
    let body;
    if (V.linear) {
      body = `<div class="cvwrap"><section class="linear" aria-label="${esc(CP.linTitle)}" data-region="list"><div><h2>${esc(CP.linTitle)}</h2><span class="small">${esc(V.linear.note)}</span></div>
        <ol style="display: grid; gap: 18px">${M.lin.map((ch) => `<li class="chap"><h3><span>${esc(ch.title)}</span><span>${esc(ch.meta)}</span></h3><ol class="lfiles">${ch.files.map((f) => `<li class="lfile"><div class="hd"><span class="small mono">${f.n}</span><code>${esc(f.path)}</code><span class="small">${esc(f.meta)}</span>${f.labels.map((l) => sl(l.label, l.tone)).join("")}</div><ul>${f.hunks.map((hk) => `<li class="hunk" aria-current="${hk.here}"><code>${esc(hk.fn)}</code><span class="muted">${esc(hk.meta)}</span>${hk.finds.map((fd) => `<span class="mk">${pb(fd.p)}${sl(fd.life, fd.tone)}<span>${esc(fd.title)}</span></span>`).join("")}${hk.labels.map((l) => sl(l.label, l.tone)).join("")}${hk.here ? `<b style="font-weight: 620">${esc(CP.here)}</b>` : ""}</li>`).join("")}</ul></li>`).join("")}</ol></li>`).join("")}</ol>

      if (!cv) return;
      const s = Math.min(1, sc.clientWidth / cv.offsetWidth);
      inner.style.transform = s < 1 ? `scale(${s})` : "";
      sc.style.blockSize = Math.ceil(cv.offsetHeight * s) + "px";
    });
  };
  new ResizeObserver(() => fit()).observe(app);
  let CMT = null;
  const COPY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>';
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const commitTime = (at, today) => { const [d, t] = String(at || "").split("T"); if (!t) return ""; if (d === today) return t; const [, mo, dd] = d.split("-"); return `${+dd} ${MONTHS[+mo - 1]} ${t}`; };
  const commitLabels = () => {
    if (!CMT) return;
    const CM = CMT.commits, K = CMT.copy, TOK = /\{commit:([0-9a-f]{7,40})\}/g;
    const info = (h) => { const c = CM[h] || {}, title = c.title ? c.title.split("\n")[0] : K.unknownTitle; return { id: c.id || h, title, time: commitTime(c.at, CMT.today), known: !!c.title }; };
    const plain = (h) => { const c = info(h); return `“${c.title}${c.time ? ", " + c.time : ""}”`; };
    for (const el of app.querySelectorAll("*")) for (const a of [...el.attributes]) if (a.value.includes("{commit:")) el.setAttribute(a.name, a.value.replace(TOK, (m, h) => plain(h)));
    const walker = document.createTreeWalker(app, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) if (walker.currentNode.nodeValue.includes("{commit:")) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const par = node.parentElement;
      if (!par || par.closest("svg, textarea, option, title, script")) { node.nodeValue = node.nodeValue.replace(TOK, (m, h) => plain(h)); continue; }
      const frag = document.createDocumentFragment(), v = node.nodeValue; let last = 0;
      v.replace(TOK, (m, h, i) => {
        frag.append(v.slice(last, i)); last = i + m.length;
        const c = info(h), lab = document.createElement("span");
        lab.className = "clabel";
        const copyBtn = `<button type="button" class="rly_IconButton-module__root rly_IconButton-module__quiet ccopy" aria-label="${esc(K.button)}" title="${esc(K.button)}" data-commit="${esc(c.id)}">${COPY_ICON}</button>`;
        const host = par.closest("a, button, label, summary");
        lab.innerHTML = `<span class="ctext" title="${esc((c.known ? c.title + "\n" : "") + K.tooltip + " " + c.id)}">“<span class="ctitle">${esc(c.title)}</span>${c.time ? ", " + esc(c.time) : ""}”</span>${host ? "" : copyBtn}`;
        if (host) {
          let wrap = host.parentElement && host.parentElement.classList.contains("cl-host") ? host.parentElement : null;
          if (!wrap) { wrap = document.createElement("span"); wrap.className = "cl-host"; host.replaceWith(wrap); wrap.append(host); }
          wrap.insertAdjacentHTML("beforeend", copyBtn);
        }
        frag.append(lab); return m;
      });
      frag.append(v.slice(last));
      node.replaceWith(frag);
    }
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest && e.target.closest(".ccopy");
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.commit).catch((err) => console.warn("copy failed", err));
  }, true);
  const draw = () => {
    const req = params.get("state") || M.X.meta.defaultState;
    const st = Object.prototype.hasOwnProperty.call(M.X.states, req) ? M.X.states[req] : null;
    root.dataset.state = st ? req : "unknown";
    if (!st) {
      const U = M.X.unknownState;
      app.innerHTML = `<main class="fail" role="alert" data-region="notice"><h1>${esc(U.title)}</h1><p>${esc(U.text)} <code>${esc(req)}</code></p><p>${esc(U.known)}: ${Object.keys(M.X.states).map((k) => `<code>${esc(k)}</code>`).join(", ")}</p></main>`;
    } else {
      const V = { ...M.base, ...M.views[st.view] };
      const isPhone = matchMedia("(max-width: 599px)").matches;
      app.innerHTML = isPhone ? phone(M, st, V) : desktop(M, st, V);
      commitLabels();
      root.dataset.layout = isPhone ? "phone" : "desktop";
      fit();
      app.querySelectorAll("textarea[data-default]").forEach((t) => { t.defaultValue = t.dataset.default; });
      root.toggleAttribute("data-fs", !!app.querySelector(".fs, .pfs"));
      app.querySelectorAll("[data-fs-scroll]").forEach((sc) => { const t = sc.querySelector('[data-fs-target="true"]'); if (t) sc.scrollTop = Math.max(0, t.offsetTop - 20); });
    }
    root.dataset.regions = [...new Set([...app.querySelectorAll("[data-region]")].map((e) => e.dataset.region))].join(" ");
  };

  fetch("../fixture.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((fx) => {
      const C = fx && fx.version === 1 && fx.data && fx.data.reviewDirections && fx.data.reviewDirections.canvas;
      if (!C || !C.screen) throw new Error("fixture.json has no data.reviewDirections.canvas.screen (version 1)");
      M = model(C);
      CMT = { commits: C.commits || {}, copy: C.screen.commitCopy, today: C.screen.meta.today };
      draw();
      matchMedia("(max-width: 599px)").addEventListener("change", draw);
      app.addEventListener("click", (e) => {
        const go = e.target.closest("[data-fs-go]"), back = e.target.closest("[data-fs-back]");
        if (!go && !back) return;
        e.preventDefault();
        const dlg = e.target.closest('[role="dialog"]'); if (!dlg) return;
        if (go) { const sc = dlg.querySelector("[data-fs-scroll]"), t = dlg.querySelector('[data-fs-key="' + go.dataset.fsGo + '"]'); if (sc && t) sc.scrollTo({ top: Math.max(0, t.offsetTop - 20), behavior: "smooth" }); }
        if (back) { const r = dlg.querySelector('[data-fs-row="' + back.dataset.fsBack + '"]'); if (r) { const p = r.closest(".pane-list"); if (p) p.scrollTo({ top: Math.max(0, r.offsetTop - 20), behavior: "smooth" }); const a = r.querySelector("a"); if (a) a.focus({ preventScroll: true }); } }
      });
      settle();
    })
    .catch((e) => {
      console.error(e);
      app.innerHTML = `<main class="fail" role="alert"><h1>Couldn’t load fixture.json</h1><p>${esc(e.message)}. Serve the project folder over HTTP and open this page from it.</p></main>`;
    });
})();
</script>
</body>
</html>
