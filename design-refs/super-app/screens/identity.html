<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identity and sign-in</title>
<link rel="stylesheet" href="rly.css">
<link rel="stylesheet" href="chrome.css">
<script src="relay-chef-modern.js"></script>
<script src="relay-creature-states.js"></script>
<script src="relay-screen-art-identity.js"></script>
<style>
@font-face { font-display: block; font-family: "Geist Variable"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-variable.woff2") format("woff2-variations"), url("fonts/geist-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-variable.woff2") format("woff2-variations"), url("fonts/geist-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist Mono Variable"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-mono-variable.woff2") format("woff2-variations"), url("fonts/geist-mono-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-mono-variable.woff2") format("woff2-variations"), url("fonts/geist-mono-variable.woff2") format("woff2"); }
html, body { margin: 0; }
body { font: 430 1rem/1.5 var(--rly-font-ui); color: var(--rly-color-text-1); background: var(--rly-color-canvas); text-wrap: pretty; overflow-wrap: break-word; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--rly-color-text-1); }
button { font: inherit; }
.sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.state + .state { border-block-start: 1px solid var(--rly-color-border-2); }
.screen { position: relative; overflow: clip; }
.screen + .screen { border-block-start: 1px solid var(--rly-color-border-2); }
.shell { min-block-size: 100vh; }
.side-in { gap: 2rem; }
.nav-heading { padding: .25rem .8rem .4rem; font-size: .75rem; color: var(--rly-color-text-3); }
.nav-group { display: grid; gap: .3rem; }
.nav-group + .nav-group { border-block-start: 1px solid var(--rly-color-border-1); margin-block-start: 1rem; padding-block-start: 1rem; }
.session[aria-expanded="true"] { background: var(--rly-color-surface-2); }
.session .avatar:empty { color: transparent; }
.mast { block-size: 80px; gap: 1rem; }
.mast-crumb { display: flex; gap: .7rem; align-items: center; font-size: .875rem; color: var(--rly-color-text-2); }
.mast-crumb b { font-weight: 520; color: var(--rly-color-text-1); }
.ask { border: 1px solid var(--rly-color-border-1); padding-inline: .7rem .65rem; }
.hosts[aria-expanded="true"] { background: var(--rly-color-surface-2); border-radius: var(--rly-radius-field); }
.hosts.p { display: none; }
.banner { display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: center; padding: .75rem 40px; border-block-end: 1px solid var(--rly-color-border-1); }
.banner > div { flex: 1 1 16rem; min-inline-size: 0; }
main { padding: 2rem 40px 2rem; max-inline-size: 1520px; }
.page { display: grid; gap: 1.5rem; max-inline-size: 52rem; min-inline-size: 0; }
.page-head { display: grid; gap: .25rem; }
.page-head h1 { margin: 0; font-size: 2.25rem; font-weight: 620; letter-spacing: -0.04em; line-height: 1.1; }
.page-head p { margin: 0; color: var(--rly-color-text-2); }
.info { margin: 0; display: flex; gap: .45rem; align-items: start; font-size: .875rem; color: var(--rly-color-text-2); }
.info svg { flex: none; margin-block-start: .15rem; }
.statecard { display: grid; justify-items: start; gap: .75rem; padding: 1.5rem; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); max-inline-size: 40rem; }
.statecard h2 { margin: 0; font-size: 1.4rem; font-weight: 620; letter-spacing: -0.02em; line-height: 1.3; overflow-wrap: anywhere; }
.statecard > p { margin: 0; font-size: .9375rem; color: var(--rly-color-text-2); }
.cmd { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; inline-size: 100%; }
.cmd code { flex: 1 1 12rem; min-inline-size: 0; padding: .6rem .9rem; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-field); background: var(--rly-color-surface-2); font: 430 .875rem/1.5 var(--rly-font-mono); overflow-wrap: anywhere; }
.approvals { display: grid; gap: .75rem; min-inline-size: 0; }
.req { display: grid; gap: 1rem; padding: 1.1rem 1.25rem; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-control); background: var(--rly-color-surface-1); min-inline-size: 0; }
.who { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 1rem; row-gap: .5rem; align-items: center; }
.who > div { min-inline-size: 0; display: grid; gap: .25rem; }
.who h3 { margin: 0; font-size: .9375rem; font-weight: 620; line-height: 1.4; text-wrap: balance; overflow-wrap: anywhere; }
.who p { margin: 0; font-size: .8125rem; color: var(--rly-color-text-2); overflow-wrap: anywhere; }
.who > span { grid-column: 2; justify-self: start; }
a.row { padding: .75rem 1rem; background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-control); color: var(--rly-color-text-1); min-inline-size: 0; }
.facts { margin: 0; display: grid; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); }
.facts > div { display: grid; grid-template-columns: minmax(0, 7.5rem) minmax(0, 1fr); gap: .2rem 1rem; padding: .65rem .9rem; border-block-start: 1px solid var(--rly-color-border-1); }
.facts > div:first-child { border-block-start: 0; }
.facts dt { font-size: .8125rem; color: var(--rly-color-text-2); }
.facts dd { margin: 0; font-size: .8125rem; line-height: 1.45; overflow-wrap: anywhere; }
.exact { display: grid; gap: .4rem; }
.exact h4 { margin: 0; font-size: .875rem; font-weight: 620; }
.exact pre { margin: 0; padding: .7rem .9rem; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-field); background: var(--rly-color-surface-2); font: 430 .8125rem/1.5 var(--rly-font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; }
.group { display: grid; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); }
.group-head { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; justify-content: space-between; padding: .9rem 1.1rem; border-block-end: 1px solid var(--rly-color-border-1); }
.group-head h2 { margin: 0; font-size: 1.05rem; font-weight: 620; line-height: 1.3; }
.group-head span { font-size: .8125rem; color: var(--rly-color-text-2); }
.agent { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: .85rem; align-items: start; padding: 1rem 1.1rem; border-block-start: 1px solid var(--rly-color-border-1); }
.agent:first-of-type { border-block-start: 0; }
.agent .body { display: grid; gap: .3rem; min-inline-size: 0; }
.agent .top { display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: center; }
.agent .top b { font-weight: 620; }
.agent small { font-size: .8125rem; color: var(--rly-color-text-2); }
.agent .body > p { margin: 0; font-size: .9375rem; }
.job { display: grid; gap: .6rem; justify-items: start; margin-block-start: .4rem; padding: .85rem 1rem; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-control); background: var(--rly-color-canvas); min-inline-size: 0; }
.job h3 { margin: 0; font-size: .9375rem; font-weight: 620; line-height: 1.4; overflow-wrap: anywhere; }
.job > p:not(.info) { margin: 0; font-size: .8125rem; color: var(--rly-color-text-2); }
.pop { position: absolute; z-index: 12; inset: auto auto 84px 12px; inline-size: 330px; box-sizing: border-box; display: grid; gap: 1rem; padding: 1.1rem 1.15rem; background: var(--rly-color-surface-1); color: var(--rly-color-text-1); border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-overlay); }
.pop > div { display: grid; gap: .2rem; min-inline-size: 0; }
.pop > div + div { padding-block-start: .9rem; border-block-start: 1px solid var(--rly-color-border-1); }
.pop b { font-weight: 620; overflow-wrap: anywhere; }
.pop span.m { font-size: .875rem; color: var(--rly-color-text-2); }
.pop h3 { margin: 0; font-size: .8125rem; font-weight: 620; color: var(--rly-color-text-2); }
.pop ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .4rem; font-size: .875rem; }
.pop li { display: flex; gap: .5rem; align-items: start; }
.pop li svg { flex: none; margin-block-start: .2rem; color: var(--rly-color-text-2); }
.pop .keys { gap: .6rem; justify-items: start; }
.pop .keys > span { font-size: .875rem; }
.backdrop { position: absolute; inset: 0; z-index: 9; background: oklch(10% 0 none / 0.35); }
.sheet { position: absolute; z-index: 10; inset: 16px 16px auto auto; inline-size: 440px; box-sizing: border-box; display: grid; gap: 1.25rem; align-content: start; padding: 1.5rem; background: var(--rly-color-surface-1); color: var(--rly-color-text-1); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-overlay); }
.sheet h2 { margin: 0; font-size: 1.3rem; font-weight: 620; letter-spacing: -0.025em; line-height: 1.3; }
.sheet .facts > div { grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr); }
.sheet .facts dd { font-size: .875rem; }
.fail { padding: 2rem; display: grid; gap: .75rem; max-inline-size: 40em; }
.fail h1 { margin: 0; font-size: 2rem; font-weight: 620; letter-spacing: -0.03em; }
.fail p { margin: 0; color: var(--rly-color-text-2); }
.fail code { font: 430 .875rem/1.4 var(--rly-font-mono); color: var(--rly-color-text-1); }

@media (max-width: 599px) {
  .shell { display: flex; flex-direction: column; }
  .work { flex: 1; }
  .screen .nav { position: sticky; order: 9; }
  .nav-item .count { display: none; }
  .mast { block-size: 72px; }
  .mast-crumb, .ask { display: none; }
  .hosts.d { display: none; }
  .hosts.p { display: flex; }
  .banner { padding: .75rem 16px; }
  main { padding: .9rem 16px 6rem; }
  .page-head h1 { font-size: 1.75rem; }
  .statecard h2 { font-size: 1.25rem; }
  .req { padding: 1rem; }
  .who { column-gap: .75rem; }
  .rly_Button-module__dense { min-block-size: var(--rly-control-height-default, 44px); }
  .statecard > .rly_Button-module__primary, .banner > .rly_Button-module__primary { inline-size: 100%; }
  .pop { inset: 80px 12px auto 12px; inline-size: auto; }
  .sheet { inset: auto 0 0 0; inline-size: auto; padding: 1.25rem 1rem 1.5rem; border-radius: 20px 20px 0 0; }
  .sheet .actions { flex-direction: column; }
  .sheet .actions .rly_Button-module__root { inline-size: 100%; }
}
</style>
</head>
<body data-rly-root data-theme="light">
<div id="app"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme") === "dark" ? "dark" : "light";
  const app = document.getElementById("app");
  document.body.dataset.theme = theme;
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.colorScheme = theme;

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const svg = (size, inner) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">${inner}</svg>`;
  const ICON = {
    clock: '<circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path>',
    alert: '<circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line>',
    minus: '<path d="M5 12h14"></path>',
    check: '<path d="M20 6 9 17l-5-5"></path>',
    plus: '<path d="M5 12h14"></path><path d="M12 5v14"></path>',
    "arrow-right": '<path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>',
    info: '<circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>',
  };
  const icon = (name, size = 16) => svg(size, ICON[name] || "");
  const stateLabel = (label, tone, ic, compact) =>
    `<span class="rly_StateLabel-module__root rly_StateLabel-module__${esc(tone)} rly_StateLabel-module__${compact ? "compact" : "defaultSize"}">${ic ? icon(ic) : ""}<span>${esc(label)}</span></span>`;
  const NOTICE_ICON = { caution: "clock", critical: "alert" };
  const notice = (tone, text, attrs = "") =>
    `<div class="rly_Notice-module__root rly_Notice-module__${tone}"${attrs}><div class="rly_Notice-module__lead"><span aria-hidden="true" class="rly_Notice-module__icon">${icon(NOTICE_ICON[tone])}</span><div class="rly_Notice-module__message"><span>${esc(text)}</span></div></div></div>`;
  const button = (label, o = {}) => {
    const v = o.variant || "secondary", size = o.size || "dense";
    const a = [`class="rly_Button-module__root rly_Button-module__${v} rly_Button-module__${size}"`, 'type="button"'];
    if (o.disabled) a.push("disabled");
    if (o.describedby) a.push(`aria-describedby="${esc(o.describedby)}"`);
    if (o.label) a.push(`aria-label="${esc(o.label)}"`);
    if (o.expanded != null) a.push(`aria-expanded="${o.expanded}"`);
    if (o.region) a.push(`data-region="${o.region}"`);
    return `<button ${a.join(" ")}><span class="rly_Button-module__content">${o.lead ? icon(o.lead) : ""}<span class="rly_Button-module__label">${esc(label)}</span>${o.trail ? icon(o.trail) : ""}</span></button>`;
  };
  const info = (text, id) => `<p class="info"${id ? ` id="${esc(id)}"` : ""}>${icon("info")}<span>${esc(text)}</span></p>`;

  const loadFonts = async () => {
    const specs = ['430 16px "Geist"', '620 16px "Geist"', '430 16px "Geist Variable"', '620 16px "Geist Variable"', '430 16px "Geist Mono"', '430 16px "Geist Mono Variable"'];
    for (let attempt = 0; attempt < 3; attempt++) {
      const res = await Promise.allSettled(specs.map((f) => document.fonts.load(f)));
      res.forEach((r, i) => { if (r.status === "rejected") console.warn("font load failed", specs[i], r.reason); });
      try { await document.fonts.ready; } catch (e) { console.warn("fonts.ready failed", e); }
      if (document.fonts.check("16px Geist")) return true;
      await new Promise((r) => setTimeout(r, 150));
    }
    return document.fonts.check("16px Geist");
  };
  const finish = async (status) => {
    try { await Promise.all([customElements.whenDefined("relay-glyph"), customElements.whenDefined("relay-agent"), customElements.whenDefined("relay-chef")]); } catch (e) { console.warn("custom elements not defined", e); }
    const ok = await loadFonts();
    if (status === "1" && !ok) { app.innerHTML = `<main class="fail" role="alert"><h1>Fonts didn’t load</h1><p>Geist isn’t available from screens/fonts, so the screen can’t be captured.</p></main>`; return; }
    requestAnimationFrame(() => requestAnimationFrame(() => { if (status === "1") document.documentElement.dataset.designReady = "true"; }));
  };

  // Chrome copy as on 22 Identity and sign-in (its shell constants, not in data.identity).
  const MOD = { connect: ["Connect", "home"], fleet: ["Fleet", "fleet"], code: ["Code", "code"], usage: ["Usage", "usage"], hostResources: ["Host resources", "host"], sandboxes: ["Sandboxes", "shield"], stacks: ["Stacks", "stacks"], settings: ["Settings", "shield"] };
  const HUB = { main: ["connect", "fleet"], after: ["code", "usage", "hostResources", "sandboxes", "stacks"], afterLabel: "Personal tools", bar: ["connect", "fleet", "code", "usage"], cur: "fleet" };
  const PEER = { main: ["connect", "code", "usage", "hostResources", "stacks"], after: ["settings"], afterLabel: "", bar: ["connect", "code", "usage"], cur: "connect" };
  const SESSION = {
    none: (dev) => ({ initial: "m", name: "Mira", line: "Not logged in, view only", aria: `Your Tailscale session on ${dev}, not logged in, view only`, dot: false }),
    person: (dev) => ({ initial: "m", name: "Mira", line: "Logged in until 21:05", aria: `Your Tailscale session, mira@example.test on ${dev}, logged in until 21:05`, dot: true }),
    ended: (dev) => ({ initial: "m", name: "Mira", line: "Session ended, view only", aria: `Your Tailscale session on ${dev}, session ended, view only`, dot: false }),
    "local-none": () => ({ initial: "", name: "This computer, view only", line: "", aria: "This computer, view only", dot: false }),
    peer: () => ({ initial: "b", name: "birch", line: "This computer", aria: "Your session on birch, this computer", dot: false }),
  };
  const PEER_AGENTS = [
    ["rev-usage", "Blocked", "critical", "blocked", "Primary, last activity 13:44", "The backup check needs a writable test directory. Can you reassign this?", true],
    ["docs-sync", "Idle", "neutral", "waiting", "Primary, idle since 13:40", "Waiting for the next task.", false],
    ["pkgsrc", "Done", "neutral", "done", "Primary, last activity 13:20", "Switchable package sources merged.", false],
  ];

  const screen = (id, I, rows, s, v) => {
    const peer = s.page === "peer", S = peer ? PEER : HUB, dev = (v && v.device) || s.device;
    const key = id + (v ? "-" + v.id : ""), L = I.lines, A = I.approvals, D = A.detail;
    const ses = SESSION[s.session](dev), pop = !!s.popover, local = peer || s.access === "loopback";
    const ids = { info: key + "--info", card: key + "--card", banner: key + "--banner", add: key + "--add", sheet: key + "--sheet" };
    const hasInfo = !!(s.viewOnly && s.access === "tailscale" && !s.banner);
    const why = !s.viewOnly ? "" : hasInfo ? ids.info : s.banner ? ids.banner : ids.card;
    const navItem = (k) => {
      const [name, g] = MOD[k], cur = k === S.cur, count = k === "fleet";
      const secondary = S.after.includes(k);
      return `<a href="#" class="nav-item"${secondary ? " data-secondary" : ""} data-bar="${S.bar.includes(k)}" aria-label="${esc(count ? "Fleet, 3 approvals waiting" : name)}" aria-current="${cur ? "page" : "false"}"><span class="g19"><relay-glyph name="${g}" size="19"></relay-glyph></span><span class="g24"><relay-glyph name="${g}" size="24"></relay-glyph></span><span class="side-name">${esc(name)}</span><span class="bar-name">${esc(name)}</span>${count ? '<span class="count" aria-label="3 approvals">3</span>' : ""}</a>`;
    };
    const hostText = local ? "This computer" : "3 hosts connected", hostGlyph = local ? "host" : "shield";
    const nav = `<aside class="side" aria-label="Relay navigation"><div class="side-in">
      <a href="#" class="brand" aria-label="Ask Relay"><relay-chef size="32"></relay-chef><span>Relay<small style="display: block; font-size: .65rem; font-weight: 430; letter-spacing: 0; margin-block-start: .2rem; color: var(--rly-color-text-2)">Ask anything about your work</small></span></a>
      <nav class="nav" aria-label="Modules" data-region="nav" style="grid-template-columns: repeat(${S.bar.length + 1}, minmax(0, 1fr))">
        <div class="nav-group">${S.main.map(navItem).join("")}</div>
        <div class="nav-group">${S.afterLabel ? `<span class="nav-heading">${esc(S.afterLabel)}</span>` : ""}${S.after.map(navItem).join("")}</div>
        <button type="button" class="nav-more" aria-label="More" aria-expanded="false" data-current="false"><relay-glyph name="grid" size="24"></relay-glyph><span>More</span></button>
      </nav>
      <button type="button" class="session" data-region="session" aria-label="${esc(ses.aria)}" aria-expanded="${pop}"><span class="avatar" aria-hidden="true">${esc(ses.initial)}</span><span>${esc(ses.name)}${ses.line ? `<small>${esc(ses.line)}</small>` : ""}</span>${ses.dot ? '<span class="online" aria-hidden="true"></span>' : ""}</button>
      ${pop ? popover(I, dev, s, v, ids) : ""}
    </div></aside>`;
    const header = `<div data-region="header">
      <header class="mast">
        <a href="#" class="mast-brand" aria-label="Ask Relay"><relay-chef size="28"></relay-chef><b class="mast-name">Relay</b></a>
        <div class="mast-crumb"><span>Relay</span><span aria-hidden="true">/</span><b>${peer ? "Connect" : "Fleet"}</b></div>
        <div class="tools">
          <button type="button" class="hosts d" aria-label="${esc(hostText)}" aria-expanded="false"><relay-glyph name="${hostGlyph}" size="19"></relay-glyph><span>${esc(hostText)}</span></button>
          <button type="button" class="hosts p" aria-label="${esc(hostText)}, your session" aria-expanded="${pop}"><relay-glyph name="${hostGlyph}" size="19"></relay-glyph><span>${esc(hostText)}</span></button>
          <button type="button" class="bell" aria-label="Notifications" aria-expanded="false"><relay-glyph name="bell" size="19"></relay-glyph></button>
          <button type="button" class="ask" aria-label="Ask Relay" aria-expanded="false"><span class="chef-desk"><relay-chef size="20"></relay-chef></span><span class="chef-phone"><relay-chef size="20"></relay-chef></span><span>Ask Relay</span><kbd>Ctrl J</kbd></button>
        </div>
      </header>
      <nav class="crumb" aria-label="Breadcrumb">${peer ? '<span class="cur" aria-current="page">Connect</span>' : '<span class="parents"><span><a href="#">Fleet</a><span aria-hidden="true">&nbsp;/&nbsp;</span></span></span><span class="cur" aria-current="page">Approvals</span>'}</nav>
    </div>`;
    const banner = s.banner ? `<div class="banner" data-region="notice"><div>${notice("caution", I.banner.text, ` id="${ids.banner}"`)}</div>${button(I.banner.button, { variant: "primary", region: "action" })}</div>` : "";
    const C = s.card ? I.cards[s.card] : null;
    const card = C ? `<section class="statecard" role="status" data-region="card">
        ${stateLabel(C.eyebrow, "neutral", "minus")}
        <h2>${esc(C.title)}</h2>
        <p id="${ids.card}">${esc(C.body.replace("{device}", dev))}</p>
        ${s.cardLine ? info(L[s.cardLine]) : ""}
        ${C.command ? `<div class="cmd"><code>${esc(C.command)}</code>${button(C.button, { label: "Copy " + C.command, region: "action" })}</div>` : button(C.button, { variant: "primary", region: "action" })}
      </section>` : "";
    const r0 = rows[0];
    const facts = [["Job", D.kind], ["Target", D.target], ["Revision", D.revision], ["Evidence", D.evidence]];
    const approvals = peer ? "" : `<section class="approvals" aria-label="Approvals waiting" data-region="list">
        <article class="req" aria-label="${esc(r0.title)}, ${esc(r0.expiry)}" data-region="detail">
          <div class="who"><relay-agent agent="${esc(r0.agent)}" state="waiting" size="44"></relay-agent><div><h3>${esc(r0.title)}</h3><p>${esc(r0.meta)}</p></div><span>${stateLabel(r0.expiry, "caution", "clock", true)}</span></div>
          <dl class="facts">${facts.map(([k, x]) => `<div><dt>${esc(k)}</dt><dd>${esc(x)}</dd></div>`).join("")}</dl>
          <div class="exact"><h4>Exact proposed action</h4><pre>${esc(D.exact)}</pre></div>
          <div class="actions" data-region="action">${button("Reject", { size: "defaultSize", disabled: s.viewOnly, describedby: why })}${button("Approve", { variant: "primary", size: "defaultSize", disabled: s.viewOnly, describedby: why, expanded: !!s.sheet })}</div>
        </article>
        ${rows.slice(1).map((x) => `<a href="#" class="row who" aria-label="${esc(x.title)}, ${esc(x.expiry)}"><relay-agent agent="${esc(x.agent)}" state="waiting" size="44"></relay-agent><div><h3>${esc(x.title)}</h3><p>${esc(x.meta)}</p></div><span>${stateLabel(x.expiry, "caution", "clock", true)}</span></a>`).join("")}
      </section>`;
    const J = I.peerJob;
    const peerList = !peer ? "" : `<section class="group" aria-labelledby="${key}--grp" data-region="list">
        <div class="group-head"><h2 id="${key}--grp">This computer</h2><span>3 agents, 1 needs you</span></div>
        ${PEER_AGENTS.map(([aid, word, tone, st, meta, voice, hasJob]) => `<article class="agent"><relay-agent agent="${aid}" host="birch" state="${st}" size="44"></relay-agent><div class="body">
          <div class="top"><b>${esc(aid)}</b>${stateLabel(word, tone, tone === "critical" ? "alert" : "minus")}</div>
          <small>${esc(meta)}</small><p>${esc(voice)}</p>
          ${hasJob ? `<div class="job" aria-label="${esc(J.title)}, ${esc(J.label)}" data-region="detail"><h3>${esc(J.title)}</h3><p>${esc(J.meta)}</p>${stateLabel(J.label, "caution", "clock", true)}${info(L.hubDown, ids.info)}${button(J.hubLink, { trail: "arrow-right", disabled: true, describedby: ids.info, region: "action" })}</div>` : ""}
        </div></article>`).join("")}
      </section>`;
    const sheetRows = I.sheet.rows;
    const sheet = !s.sheet ? "" : `<div class="backdrop" aria-hidden="true"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="${ids.sheet}" data-region="sheet">
        <h2 id="${ids.sheet}">${esc(I.sheet.title)}</h2>
        <dl class="facts">${sheetRows.map(([k, x]) => `<div><dt>${esc(k)}</dt><dd>${esc(x)}</dd></div>`).join("")}</dl>
        ${s.sheet === "failed" ? notice("critical", I.sheet.failed, ' role="alert" data-region="notice"') : ""}
        <div class="actions" data-region="action">${button(s.sheet === "failed" ? I.sheet.retry : I.sheet.use, { variant: "primary", size: "defaultSize" })}${button(I.sheet.cancel, { size: "defaultSize" })}</div>
      </div>`;
    const lead = peer ? "Who’s working, who’s blocked, who needs you" : A.lead;
    return `<div class="screen"${v ? ` data-variant="${esc(v.id)}"` : ""}><div class="shell">${nav}<div class="work">${header}${banner}<main><div class="page">
        <div class="page-head"><h1>${peer ? "Connect" : "Approvals"}</h1><p>${esc(lead)}</p></div>
        ${hasInfo ? `<div data-region="notice">${info(L.viewOnly, ids.info)}</div>` : ""}
        ${card}${approvals}${peerList}
      </div></main></div></div>${sheet}</div>`;
  };

  const popover = (I, dev, s, v, ids) => {
    const P = I.popover, off = !!(v && v.addDisabled);
    return `<div class="pop" role="dialog" aria-label="Your session" data-region="popover">
      <div><b>${esc(P.who)}</b><span class="m">${esc(P.how.replace("{device}", dev))}</span><span class="m">${esc(P.until)}</span></div>
      <div><h3>${esc(P.canLabel)}</h3><ul>${P.can.map((c) => `<li>${icon("check")}<span>${esc(c)}</span></li>`).join("")}</ul></div>
      ${s.passkeys ? `<div class="keys"><span>${esc(P.passkeys)}</span>${button(P.addPasskey, { lead: "plus", disabled: off, describedby: off ? ids.add : "", region: "action" })}${off ? info(I.lines[v.line], ids.add) : ""}</div>` : ""}
      <div>${button(P.logOut, { variant: "quiet" })}</div>
    </div>`;
  };

  const render = (data) => {
    const I = data.identity, rows = data.fleet.fleet.approvals.rows;
    const req = params.get("state") === "all" ? null : params.get("state");
    if (req && !I.states[req]) {
      document.documentElement.dataset.state = "unknown";
      app.innerHTML = `<main class="fail" role="alert" data-region="notice"><h1>Unknown state</h1><p>No state <code>${esc(req)}</code> in fixture.json.</p><p>Known states: ${Object.keys(I.states).map((k) => `<code>${esc(k)}</code>`).join(", ")}.</p></main>`;
      return;
    }
    document.documentElement.dataset.state = req || "all";
    const list = Object.entries(I.states).filter(([id]) => !req || id === req);
    app.innerHTML = list.map(([id, s]) => `<section class="state" id="${esc(id)}" aria-label="${esc(s.name)}" data-state="${esc(id)}">${s.variants ? s.variants.map((v) => screen(id, I, rows, s, v)).join("") : screen(id, I, rows, s)}</section>`).join("");
  };

  fetch("../fixture.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((fx) => { render(fx.data); finish("1"); })
    .catch((e) => {
      app.innerHTML = `<main class="fail" role="alert"><h1>Couldn’t load fixture.json</h1><p>${esc(e.message)}. Serve the project folder over HTTP and open this page from it.</p></main>`;
      finish("error");
    });
})();
</script>
</body>
</html>
