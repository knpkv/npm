<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<script src="relay-creature-states.js"></script>
<script src="relay-screen-art.js"></script>
<style>
@font-face { font-display: block; font-family: "Geist Variable"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-variable.woff2") format("woff2-variations"), url("fonts/geist-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-variable.woff2") format("woff2-variations"), url("fonts/geist-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist Mono Variable"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-mono-variable.woff2") format("woff2-variations"), url("fonts/geist-mono-variable.woff2") format("woff2"); }
@font-face { font-display: block; font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("fonts/geist-mono-variable.woff2") format("woff2-variations"), url("fonts/geist-mono-variable.woff2") format("woff2"); }
html, body { margin: 0; }
body { font: 430 1rem/1.5 var(--rly-font-ui); color: var(--rly-color-text-1); background: var(--rly-color-canvas); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--rly-color-text-1); }
button, input { font: inherit; }
.sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }



main { display: grid; align-content: start; gap: 1.25rem; padding: 1.5rem 40px 2rem; }
.panel { border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); background: var(--rly-color-surface-1); }
.strip { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: .5rem 1.5rem; align-items: center; padding: .8rem 1rem; }
.strip .need { display: flex; gap: .5rem; align-items: baseline; }
.strip b.n { font-size: 1.5rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.strip .word { font-size: .875rem; }
.strip .ap { display: flex; flex-wrap: wrap; gap: .1rem .5rem; align-items: center; min-block-size: 44px; }
.strip .ap .num { display: flex; gap: .4rem; align-items: baseline; }
.strip .ap .link { font-size: .875rem; text-decoration: underline; text-underline-offset: .2em; }
.strip .ap small { flex-basis: 100%; font-size: .75rem; color: var(--rly-color-text-2); }
.strip p { margin: 0; font-size: .8125rem; color: var(--rly-color-text-2); min-inline-size: 0; }
.group { display: grid; gap: .6rem; }
.group-head { display: flex; gap: .5rem; align-items: center; min-block-size: 44px; }
.group-head h2 { margin: 0; font-size: 1.05rem; font-weight: 620; }
.group-head small { font-size: .8125rem; color: var(--rly-color-text-2); }
.group-head .rly_Button-module__root { margin-inline-start: auto; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.agent { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .25rem .8rem; align-items: start; padding: .8rem .9rem; }
.agent[aria-current="true"] { background: var(--rly-color-surface-2); border-color: var(--rly-color-border-2); }
.agent .top { display: flex; flex-wrap: wrap; gap: .2rem .6rem; align-items: center; }
.agent .top b { font-weight: 620; }
.agent .top > span { flex: none; white-space: nowrap; }
.agent small { font-size: .75rem; color: var(--rly-color-text-2); }
.agent .voice { font-size: .875rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.agent .body { display: grid; gap: .2rem; min-inline-size: 0; }
.empty { display: grid; justify-items: start; gap: .8rem; padding: 1.5rem; max-inline-size: 40em; }
.empty h2 { margin: 0; font-size: 1.4rem; font-weight: 620; letter-spacing: -0.02em; line-height: 1.25; text-wrap: balance; }
.empty p { margin: 0; color: var(--rly-color-text-2); }
.empty ol { margin: 0; padding-inline-start: 1.2em; display: grid; gap: .3rem; font-size: .9375rem; }
.empty small { font-size: .8125rem; color: var(--rly-color-text-2); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.list { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; align-items: center; min-block-size: 56px; padding: .8rem 1rem; border-block-start: 1px solid var(--rly-color-border-1); }
.row:first-child { border-block-start: 0; }
.row > span { display: grid; gap: .1rem; min-inline-size: 0; }
.row small.o { font: 430 .75rem/1.3 var(--rly-font-mono); color: var(--rly-color-text-2); }
.row b { font-weight: 620; }
.row small.m { font-size: .8125rem; color: var(--rly-color-text-2); }
.btn-tap { min-block-size: var(--rly-control-height-compact); }

.stage { position: fixed; z-index: 10; inset: 16px 16px 16px auto; inline-size: 460px; display: flex; flex-direction: column; background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-overlay); overflow: hidden; }
.stage-head { flex: none; display: flex; gap: .5rem; align-items: center; block-size: 64px; box-sizing: border-box; padding-inline: .75rem 1rem; border-block-end: 1px solid var(--rly-color-border-1); }
.stage-head p { margin: 0; font-size: 1.0625rem; min-inline-size: 0; display: flex; gap: .45rem; }
.stage-head p b { font-weight: 650; }
.stage-head p span { color: var(--rly-color-text-2); }
.stage-back { display: none; place-items: center; min-inline-size: 44px; min-block-size: 44px; }
.stage-close { margin-inline-start: auto; display: grid; place-items: center; min-inline-size: 44px; min-block-size: 44px; color: inherit; background: transparent; border: 0; }
.stage-body { flex: 1; min-block-size: 0; overflow: auto; display: grid; align-content: start; gap: 1.1rem; padding: 1.25rem 1rem; }
.stage-who { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1rem; align-items: center; }
.stage-who > div { display: grid; gap: .3rem; }
.stage-who h2 { justify-self: start; margin: 0; font-size: 1.5rem; font-weight: 620; letter-spacing: -0.03em; outline: 2px solid var(--rly-color-focus); outline-offset: 3px; border-radius: 4px; }
.stage-who small { font-size: .8125rem; color: var(--rly-color-text-2); }
.posts { margin: 0; padding: 0; list-style: none; display: grid; border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-group); }
.posts li { display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: .75rem; padding: .7rem .9rem; border-block-start: 1px solid var(--rly-color-border-1); font-size: .875rem; }
.posts li:first-child { border-block-start: 0; }
.posts li span:first-child { font-variant-numeric: tabular-nums; color: var(--rly-color-text-2); }
.composer { flex: none; display: flex; gap: .5rem; align-items: center; padding: .75rem 1rem 1rem; border-block-start: 1px solid var(--rly-color-border-1); }
.composer label { flex: 1; min-inline-size: 0; }
.composer input { box-sizing: border-box; inline-size: 100%; min-block-size: 44px; padding-inline: .8rem; font-size: .9375rem; color: inherit; background: var(--rly-color-canvas); border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-field); }

.fail { padding: 2rem; display: grid; gap: .75rem; max-inline-size: 40em; }
.fail h1 { margin: 0; font-size: 2rem; font-weight: 620; letter-spacing: -0.03em; }
.fail p { margin: 0; color: var(--rly-color-text-2); }
.fail code { font: 430 .875rem/1.4 var(--rly-font-mono); color: var(--rly-color-text-1); }

@media (max-width: 599px) {
  body { padding-block-end: env(safe-area-inset-bottom); }
  main { padding: 1rem 16px 96px; }
  .strip { grid-template-columns: auto auto; }
  .strip p { grid-column: 1 / -1; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .btn-tap { min-block-size: var(--rly-control-height-default); }
  .stage { inset: 0; inline-size: auto; border: 0; border-radius: 0; z-index: 10; }
  .stage-back { display: grid; }
  .stage-close { display: none; }
}

.review { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
.pr { grid-column: 1 / -1; display: grid; gap: .6rem; padding: 1rem 1.25rem; }
.pr-top { display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; font-size: .875rem; color: var(--rly-color-text-2); }
.pr-top b { font: 520 .875rem/1.4 var(--rly-font-mono); color: var(--rly-color-text-2); }
.pr h2 { margin: 0; font-size: 1.5rem; font-weight: 620; letter-spacing: -0.025em; line-height: 1.25; text-wrap: balance; }
.pr-meta { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; font-size: .875rem; color: var(--rly-color-text-2); }
.pr-meta code { font: 430 .8125rem/1.4 var(--rly-font-mono); color: var(--rly-color-text-1); }
.pr-rows { display: flex; flex-wrap: wrap; gap: .75rem 2rem; align-items: center; padding-block-start: .6rem; border-block-start: 1px solid var(--rly-color-border-1); }
.pr-row { display: flex; flex-wrap: wrap; gap: .4rem .75rem; align-items: center; font-size: .875rem; }
.pr-row small { font-size: .8125rem; color: var(--rly-color-text-2); }
.col { display: grid; gap: 1rem; min-inline-size: 0; }
.sum { display: grid; gap: .9rem; padding: 1rem 1.1rem 1.1rem; }
.verdict { display: grid; gap: .2rem; }
.verdict .rly_StateLabel-module__root { font-size: 1.125rem; font-weight: 620; }
.verdict small { font-size: .8125rem; color: var(--rly-color-text-2); }
.sum p { margin: 0; font-size: .9375rem; text-wrap: pretty; }
.sum h3 { margin: 0 0 .3rem; font-size: .8125rem; font-weight: 560; color: var(--rly-color-text-2); }
.sum ul { margin: 0; padding-inline-start: 1.1em; display: grid; gap: .25rem; font-size: .875rem; }
.counts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
.counts dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .75rem; font-size: .875rem; }
.counts dt { color: var(--rly-color-text-2); }
.counts dd { margin: 0; font-weight: 620; font-variant-numeric: tabular-nums; text-align: end; }
.chip { justify-self: start; display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .6rem; font-size: .8125rem; border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-round); }
.rules summary { display: flex; align-items: center; gap: .4rem; min-block-size: 44px; font-size: .875rem; font-weight: 520; cursor: pointer; list-style: none; }
.rules summary::-webkit-details-marker { display: none; }
.rules summary relay-glyph { transition: transform .15s; }
.rules[open] summary relay-glyph { transform: rotate(90deg); }
.rules ul { list-style: none; padding: 0; }
.rules code { font: 430 .8125rem/1.4 var(--rly-font-mono); }
.reviewer { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .1rem .6rem; align-items: center; padding-block-start: .8rem; border-block-start: 1px solid var(--rly-color-border-1); font-size: .875rem; }
.reviewer relay-agent { grid-row: span 2; }
.reviewer small { font-size: .8125rem; color: var(--rly-color-text-2); }
.findings { display: grid; }
.fhead { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .75rem 1rem; border-block-end: 1px solid var(--rly-color-border-1); }
.fhead h2 { margin: 0; font-size: 1rem; font-weight: 620; }
.fhead small { font-size: .8125rem; color: var(--rly-color-text-2); }
.frow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .2rem .7rem; align-items: start; min-block-size: 56px; box-sizing: border-box; padding: .7rem 1rem; color: inherit; border-block-end: 1px solid var(--rly-color-border-1); }
.frow:hover { background: var(--rly-color-surface-2); }
.frow > span { display: grid; gap: .2rem; min-inline-size: 0; }
.frow .claim { font-size: .9375rem; text-wrap: pretty; }
.frow small { display: flex; flex-wrap: wrap; gap: .1rem .75rem; font-size: .8125rem; color: var(--rly-color-text-2); }
.frow small code { font: 430 .75rem/1.5 var(--rly-font-mono); color: var(--rly-color-text-1); }
.fnone { margin: 0; padding: .9rem 1rem; font-size: .875rem; color: var(--rly-color-text-2); border-block-end: 1px solid var(--rly-color-border-1); }
.fgroup { display: flex; align-items: center; gap: .5rem; inline-size: 100%; min-block-size: 48px; padding: 0 1rem; font-size: .875rem; font-weight: 560; color: inherit; text-align: start; background: transparent; border: 0; cursor: pointer; }
.fgroup relay-glyph { transition: transform .15s; }
.fgroup[aria-expanded="true"] relay-glyph { transform: rotate(90deg); }
.fgroup[aria-expanded="true"] { border-block-end: 1px solid var(--rly-color-border-1); }
.p2 .frow:last-child { border-block-end: 0; }
.sev { display: inline-grid; place-items: center; min-inline-size: 2.1rem; padding: .15rem .35rem; box-sizing: border-box; font: 620 .75rem/1.3 var(--rly-font-mono); color: var(--rly-color-text-2); background: var(--rly-color-surface-2); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-tag); }
.sev[data-s="P0"] { color: var(--rly-color-blocked-ink); background: var(--rly-color-blocked-tint); border-color: transparent; }
.sev[data-s="P1"] { color: var(--rly-color-held-ink); background: var(--rly-color-held-tint); border-color: transparent; }
.axis { display: inline-flex; padding: 0 .4rem; font-size: .75rem; line-height: 1.5; color: var(--rly-color-text-2); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-tag); }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.diff { display: grid; gap: 1rem; min-inline-size: 0; }
.dfile { overflow: hidden; }
.dfile-head { display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: .6rem .9rem; font: 430 .8125rem/1.4 var(--rly-font-mono); background: var(--rly-color-surface-2); border-block-end: 1px solid var(--rly-color-border-1); }
.dfile-head span { color: var(--rly-color-text-2); white-space: nowrap; }
.hunk { padding: .3rem .9rem; font: 430 .75rem/1.5 var(--rly-font-mono); color: var(--rly-color-text-2); background: var(--rly-color-surface-2); border-block-start: 1px solid var(--rly-color-border-1); }
.dfile-head + .hunk { border-block-start: 0; }
.dtab { inline-size: 100%; border-collapse: collapse; table-layout: auto; font: 430 .8125rem/1.6 var(--rly-font-mono); }
.dtab col.n { inline-size: 3.25rem; }
.dtab col.m { inline-size: 1.2rem; }
.dtab th { padding: 0; font: 700 0.78rem/1.55 var(--rly-font-mono); white-space: normal; word-break: normal; overflow-wrap: break-word; color: var(--rly-color-text-2); text-align: start; background: var(--rly-color-surface-2); border-block-end: 1px solid var(--rly-color-border-1); }
.dtab th:nth-child(-n+2) { text-align: end; }
.dtab td { padding: 0; vertical-align: top; }
.dtab .num { padding-inline: 8px 6px; text-align: end; color: var(--rly-color-text-3); font-size: .75rem; line-height: 1.75; user-select: none; }
.dtab .mk { text-align: center; color: var(--rly-color-text-2); user-select: none; }
.dtab .code { white-space: pre-wrap; overflow-wrap: anywhere; padding-inline-end: .75rem; }
.dtab tr[data-t="+"] td { background: var(--rly-color-success-tint); }
.dtab tr[data-t="-"] td { background: var(--rly-color-blocked-tint); }
.dtab .hk td { padding: .3rem .9rem; font-size: .75rem; line-height: 1.5; color: var(--rly-color-text-2); background: var(--rly-color-surface-2); border-block-start: 1px solid var(--rly-color-border-1); white-space: pre; }
.dtab .ann > td > .fcard, .dtab .ann > td > .othread { margin: .5rem .75rem .75rem; }
.othread { display: grid; gap: .6rem; padding: .9rem 1rem 1rem; font-family: var(--rly-font-ui); }
.othread code { font-family: var(--rly-font-mono); }
.othread .tags { display: flex; flex-wrap: wrap; gap: .35rem .6rem; align-items: center; }
.othread ol { margin: 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
.othread li { display: grid; gap: .15rem; }
.othread li > div { display: flex; flex-wrap: wrap; gap: .1rem .5rem; align-items: baseline; font-size: .8125rem; }
.othread li b { font-weight: 620; }
.othread time { color: var(--rly-color-text-2); }
.othread p { margin: 0; font-size: .9375rem; text-wrap: pretty; }
.ln { display: grid; grid-template-columns: 2.6rem 2.6rem 1.2rem minmax(0, 1fr); font: 430 .8125rem/1.6 var(--rly-font-mono); }
.ln > span:nth-child(-n+2) { padding-inline-end: .5rem; text-align: end; color: var(--rly-color-text-3); font-size: .75rem; line-height: 1.75; user-select: none; }
.ln > span:nth-child(3) { text-align: center; color: var(--rly-color-text-2); }
.ln code { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; padding-inline-end: .75rem; }
.ln[data-t="+"] { background: var(--rly-color-success-tint); }
.ln[data-t="-"] { background: var(--rly-color-blocked-tint); }
.ln[data-hit] > span:nth-child(2) { color: var(--rly-color-text-1); font-weight: 620; }
.fcard { display: grid; gap: .6rem; margin: .5rem .75rem .75rem; padding: .9rem 1rem 1rem; font-family: var(--rly-font-ui); background: var(--rly-color-surface-1); border: 1px solid var(--rly-color-border-2); border-radius: var(--rly-radius-group); scroll-margin-block-start: 1rem; }
.fcard:focus { outline: 2px solid var(--rly-color-focus); outline-offset: 2px; }
.fcard .claim { margin: 0; font-size: .9375rem; font-weight: 620; text-wrap: pretty; }
.fcard .why { margin: 0; font-size: .875rem; color: var(--rly-color-text-2); text-wrap: pretty; }
.fcard small { font-size: .8125rem; color: var(--rly-color-text-2); }
.fcard small code { font: 430 .75rem/1.5 var(--rly-font-mono); color: var(--rly-color-text-1); }
.patch { margin: 0; padding: .4rem 0; font: 430 .75rem/1.6 var(--rly-font-mono); background: var(--rly-color-canvas); border: 1px solid var(--rly-color-border-1); border-radius: var(--rly-radius-field); overflow: hidden; }
.patch span { display: block; padding-inline: .6rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.patch span[data-t="+"] { background: var(--rly-color-success-tint); }
.patch span[data-t="-"] { background: var(--rly-color-blocked-tint); }
.patch-label { font-size: .75rem; font-weight: 560; color: var(--rly-color-text-2); }
.unanch { display: grid; }
.unanch .fhead { border-block-end: 0; }
.unanch .fcard { margin-block-start: 0; }
main { container-type: inline-size; }

@media (max-width: 599px) {
  .review { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
  .pr { padding: .9rem 1rem; }
  .pr h2 { font-size: 1.25rem; }
  .pr-rows { flex-direction: column; align-items: stretch; gap: .6rem; }
  .ln { grid-template-columns: 2.2rem 1rem minmax(0, 1fr); }
  .ln > span:first-child { display: none; }
  .fcard { margin-inline: .4rem; }
  .actions .rly_Button-module__root, .pr .rly_Button-module__root { min-block-size: 44px; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.pr-meta .nowrap { white-space: nowrap; }
.spin { flex: none; display: inline-block; inline-size: 12px; block-size: 12px; border-radius: 50%; border: 2px solid var(--rly-color-border-2); border-block-start-color: var(--rly-color-text-2); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.prog-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .8rem; align-items: center; }
.prog-head > div { display: grid; gap: .1rem; }
.prog-head b { font-size: 1.125rem; font-weight: 620; }
.prog-head small, .nap { font-size: .8125rem; color: var(--rly-color-text-2); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: .45rem; font-size: .875rem; }
.steps li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: .6rem; align-items: center; }
.steps li .spin { margin-inline-start: 2px; }
.steps li[data-s="waiting"] { color: var(--rly-color-text-2); }
.steps li[data-s="current"] { font-weight: 560; }
.sum-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.tag-new, .tag-old { display: inline-flex; padding: 0 .4rem; font-size: .75rem; line-height: 1.5; border-radius: var(--rly-radius-tag); }
.tag-new { font-weight: 560; color: var(--rly-color-text-1); background: var(--rly-color-surface-3); }
.tag-old { color: var(--rly-color-text-2); background: var(--rly-color-surface-2); border: 1px solid var(--rly-color-border-1); }

  const COPY_ICON = svg('<rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>');

  const render = (C) => {

    const hasTabs = mod.tabs.length > 1;

    const RA = "Read again";
    const parseN = (s) => { let owner = null, body = s; const nl = s.indexOf("\n"), dbl = s.indexOf("\n\n"); if (nl >= 0 && nl !== dbl) { owner = s.slice(0, nl); body = s.slice(nl + 1); } const ps = body.split("\n\n"); const inBtn = ps[ps.length - 1] === RA; if (inBtn) ps.pop(); return { owner, title: ps[0], lines: ps.slice(1), text: ps.slice(1).join("\n"), inBtn }; };

    };

    const R = C.review, V = liveV(R.variants[S.variant]), P = { ...R.pr, ...(V.pr || {}), ...(LV ? { cachedApproval: "Cached approval waiting", checks: "Checks unknown", checksTone: "neutral", checksDetail: "" } : {}) };

    const btn = (label, variant, extra = "") => label === "Read again" ? `<button type="button" class="rly_Button-module__root rly_Button-module__primary rly_Button-module__compact" style="font: var(--rly-type-label-weight) var(--rly-type-label-size) / var(--rly-type-label-line-height) var(--rly-type-label-font); letter-spacing: var(--rly-type-label-tracking); padding-block: 0; padding-inline: var(--rly-space-16); min-block-size: var(--rly-control-height-compact)" data-read-again${extra}><span class="rly_Button-module__content"><span class="rly_Button-module__label">${esc(label)}</span></span></button>` : `<button type="button" class="rly_Button-module__root rly_Button-module__${variant} rly_Button-module__dense"${extra}><span class="rly_Button-module__content"><span class="rly_Button-module__label">${esc(label)}</span></span></button>`;

    const F = V.findings.map((id) => RXS ? rf(id) : R.findings[id]);

    const nReplies = (n) => n === 1 ? R.copy.oneReply : R.copy.nReplies.replace("{n}", n);

      const [src, anchor] = it.header;
      return `<li class="citem">
        <div class="csrc">${lmark(it.source)}<span>${esc(src)}</span>${anchor ? (anchor === WHOLE_PR ? `<small>${esc(anchor)}</small>` : `<small><code>${esc(anchor)}</code></small>`) : ""}</div>
        ${it.lead ? `<a href="#f-${esc(it.id)}" class="cfind" title="${esc(it.lead[1])}">${sev({ sev: it.lead[0] })}<span class="cclaim">${esc(it.lead[1])}</span></a>` : ""}
        <ol class="tlist">${it.messages.map((m) => `<li class="tpost" data-plain><div><p class="ph"><b>${esc(m.author)}</b><small>${ltime(m)}</small></p><p${m.body === R.copy.commentDeleted ? ' class="cdel"' : ""}>${esc(m.body)}</p></div></li>`).join("")}</ol>
      </li>`;
    };
    const LH = LV && LV.conversationHead;
    const LNOHEAD = LH && LH[0] !== CV.title;
    const lconv = LV && LV.conversation && S.subtab === "conversation" ? `<section class="panel conv" aria-label="${esc(CV.title)}" data-region="list">${LNOHEAD ? `${LNS.slice(0, 1).map(lnotice).join("")}<div class="fhead"><h2>${esc(CV.title)}</h2></div>${LNS.slice(1).map(lnotice).join("")}` : `<div class="fhead"><h2>${esc(CV.title)}</h2>${LH && /^Unresolved/.test(LH[1] || "") ? `<small>${esc(LH[1])}</small>` : ""}</div>${LNS.map(lnotice).join("")}`}${LACT.includes("conversation") ? `<div class="cact">${btn(RA, "primary", ' data-region="action"')}</div>` : ""}${LV.conversation.length ? `<ol class="clist">${LV.conversation.map(lci).join("")}</ol>` : ""}</section>` : "";
    const conv = lconv ? lconv : TM && S.subtab === "conversation" && VC ? rconv : TM && S.subtab === "conversation" && LN ? `<section class="panel conv" aria-label="${esc(CV.title)}" data-region="list"><div class="fhead"><h2>${esc(CV.title)}</h2></div>${noticeBox(LN)}</section>` : TM && S.subtab === "conversation" ? `<section class="panel conv" aria-label="${esc(CV.title)}" data-region="list"><div class="fhead"><h2>${esc(CV.title)}</h2><small>${esc(CV.count)}</small></div><ol class="clist">${CV.items.map(citem).join("")}</ol></section>` : "";
    const GD = TM && S.subtab === "guide" ? R.guide : null;
    let guide = "";
    if (GD && V.guideNone) {
      const GN = V.guideNone;
      guide = `<section class="panel gbody gnone" aria-labelledby="g-title" data-region="guide"><h2 id="g-title">${esc(GN.title)}</h2>${GN.text ? `<p>${esc(GN.text)}</p>` : ""}${GN.action ? `<div class="gnext" data-region="action">${btn(GN.action, "primary")}</div>` : ""}</section>`;
    } else if (GD) {
      const ch = GD.chapters, oi = S.chapter - 1, O = ch[oi], prev = ch[oi - 1], next = ch[oi + 1], read = new Set(S.read || []);
      const of = GD.chapterOf.replace("{n}", oi + 1).replace("{t}", ch.length);
      const arrow = (dir, c) => `<button type="button" class="gnav" data-dir="${dir}" aria-label="${esc((dir === "prev" ? GD.prevLabel : GD.nextLabel) + ": " + c.title)}"><relay-glyph name="arrow" size="18"></relay-glyph></button>`;
      const rail = `<nav class="panel grail" aria-label="${esc(GD.railLabel)}" data-region="chapters"><h2>${esc(GD.railLabel)}</h2><ol>${ch.map((c, i) => `<li><a href="#" class="gch" aria-current="${i === oi ? "step" : "false"}"${read.has(i + 1) ? " data-read" : ""}><span class="gnum" aria-hidden="true">${read.has(i + 1) ? CHECK_ICON : i + 1}</span><span>${esc(c.title)}</span>${read.has(i + 1) ? `<span class="sr">, ${esc(GD.readWord)}</span>` : ""}</a></li>`).join("")}</ol>
        <div class="gout"><h3>${esc(GD.outside.title)}</h3><ul>${GD.outside.files.map((p) => { const f = R.files.find((x) => x.path === p); return `<li><a href="#"><code>${esc(p)}</code><span>${esc(f.stat)}</span></a></li>`; }).join("")}</ul></div></nav>`;
      const CL = O.checklist ? `<section class="gcheck" aria-labelledby="ck-title" data-region="checklist"><h3 id="ck-title">${esc(GD.checklistTitle)}</h3><ul>${O.checklist.map((it) => `<li><span class="gq">${esc(it.q)}</span>${stateLabel(it.a, it.a === "Yes" ? "positive" : it.a === "No" ? "caution" : "neutral", true)}<small>${esc(it.note)}</small></li>`).join("")}</ul></section>` : "";
      guide = `${rail}<section class="panel gbody" aria-labelledby="g-title" data-region="guide">
        <div class="gswitch">${prev ? arrow("prev", prev) : '<span class="gnav-gap"></span>'}<div><small>${esc(of)}</small><b>${esc(O.title)}</b></div>${next ? arrow("next", next) : '<span class="gnav-gap"></span>'}</div>
        <div class="ghead"><div><small>${esc(of)}</small><h2 id="g-title">${esc(O.title)}</h2></div>${V.noRun ? "" : `<div class="gseg" role="group" aria-label="${esc(GD.viewLabel)}">${GD.views.map((v, i) => `<a href="#" class="gseg-item" aria-pressed="${i === 0}">${esc(v)}</a>`).join("")}</div>`}</div>
        <div class="gprose"><h3>${esc(GD.problem)}</h3><p>${esc(O.problem)}</p>
          <div class="gba"><div><h3>${esc(GD.before)}</h3><p>${esc(O.before)}</p></div><div><h3>${esc(GD.after)}</h3><p>${esc(O.after)}</p></div></div>
          <h3>${esc(GD.decisions)}</h3><ul>${O.decisions.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>
        <div class="ghunks" data-region="diff">${O.hunks.map(([p, i]) => { const f = R.files.find((x) => x.path === p); return `<div class="panel dfile"><div class="dfile-head"><b>${esc(p)}</b><span>${esc(f.stat)}</span></div>${lines({ ...f, hunks: [f.hunks[i]] })}</div>`; }).join("")}</div>
        ${CL}
        ${next ? `<div class="gnext" data-region="action">${btn(GD.next.replace("{t}", next.title), "primary")}</div>` : ""}
      </section>`;
    }
    const FM = V.focusMode, FXC = R.copy.focus;
    let focus = "";
    if (FM) {
      const FF = R.findings[FM.id], ff = R.files.find((x) => x.path === FF.file), hk = ff.hunks[FM.hunk];
      const plain = `<div class="hunk">${esc(hk.head)}</div>` + hk.lines.map((l) => `<div class="ln" data-t="${esc(l.t)}"${l.n === FF.line && l.t !== "-" ? " data-hit" : ""}><span>${esc(l.o || "")}</span><span>${esc(l.t === "-" ? "" : l.n)}</span><span aria-hidden="true">${esc(l.t === " " ? "" : l.t)}</span><code>${esc(l.s)}</code></div>`).join("");
      focus = `<section class="panel ffocus" aria-labelledby="ff-title" data-region="detail">
        <div class="ff-top"><a href="#" class="ff-back"><relay-glyph name="arrow" size="16"></relay-glyph>${esc(FXC.back)}</a><div class="ff-pager"><button type="button" class="gnav" data-dir="prev" aria-label="${esc(FXC.prev)}"><relay-glyph name="arrow" size="18"></relay-glyph></button><span aria-live="polite">${esc(FXC.pos)}</span><button type="button" class="gnav" data-dir="next" aria-label="${esc(FXC.next)}"><relay-glyph name="arrow" size="18"></relay-glyph></button></div></div>
        <div class="tags">${sev(FF)}<span class="axis">${esc(FF.axis)}</span><small><code>${esc(where(FF))}</code><span>${esc(FF.confidence)}</span></small></div>
        <h2 id="ff-title">${esc(FF.claim)}</h2>
        <div class="panel dfile" data-region="diff"><div class="dfile-head"><b>${esc(ff.path)}</b><span>${esc(ff.stat)}</span></div>${plain}</div>
        <h3>${esc(FXC.why)}</h3><p>${esc(FF.why)}</p>
        <h3>${esc(FXC.patch)}</h3><div class="panel dfile ffpatch">${FF.patch.map((l) => `<div class="ln" data-t="${esc(l[0])}"><span></span><span></span><span aria-hidden="true">${esc(l[0])}</span><code>${esc(l.slice(1))}</code></div>`).join("")}</div>
      </section>
      <div class="ffbar" data-region="action">${btn(R.copy.apply, "primary")}${btn(R.copy.ask, "secondary")}${btn(R.copy.dismiss, "secondary")}${btn(FXC.more, "secondary", ' aria-haspopup="menu" aria-expanded="false"')}</div>`;
    }
    const PN = V.pageNotice, RT = V.retained;
    const pre = RT ? `<div class="panel notice rstat" role="status" aria-live="polite" data-region="status"><div>${stateLabel(C.reasonWords["review-transport-failed"].reasons.network, "caution", true)}<span class="text">${esc(RT.title)}</span></div>${RT.action ? `<div data-act>${btn(RT.action, "primary", ' data-region="action"')}</div>` : ""}</div>` : "";
    const pageBody = V.pending ? `<div class="review"><section class="panel rpend" role="status" aria-live="polite" data-region="status"><p>${esc(V.pending)}</p></section></div>`
      : PN ? `<div class="review"><section class="panel notice pnotice" role="status" data-region="notice"><div>${stateLabel(PN.title || PN.lines[0], "caution", true)}${(PN.title ? PN.lines : PN.lines.slice(1)).map((l) => `<span class="text">${esc(l)}</span>`).join("")}</div>${PN.action && !LV ? `<div data-act>${btn(PN.action, "primary", ' data-region="action"')}</div>` : ""}</section>${V.pageAction ? `<div class="cact wact">${btn(V.pageAction, "primary", ' data-region="action"')}</div>` : ""}</div>` : "";
    const body = pageBody ? pageBody : focus ? `<div class="focus-wrap">${focus}</div>` : conv ? `<div class="review">${pre}${prHead}${subtabs}${conv}</div>` : guide ? `<div class="review guide-mode">${pre}${prHead}${subtabs}${guide}</div>` : `<div class="review">${pre}${prHead}${subtabs}<div class="col">${summaryX}${listX === null ? list : listX}</div>${diff}</div>`;
    const PS = V.postSheet ? R.copy.postSheet : null, DS = TM && V.dismissForm && phone, KS = V.keys ? R.copy.keys : null;
    const sheet = PS ? `<div class="scrim" data-modal aria-hidden="true"></div><section class="csheet" role="dialog" aria-modal="true" aria-labelledby="post-title" data-region="sheet"><h2 id="post-title">${esc(PS.title)}</h2><p>${esc(PS.lead)}</p><ul>${V.postSheet.map((id) => R.findings[id]).map((f) => `<li>${sev(f)}<span><span class="claim">${esc(f.claim)}</span><small><code>${esc(where(f))}</code></small></span></li>`).join("")}</ul><div class="actions">${btn(PS.post, "primary")}${btn(PS.cancel, "secondary")}</div></section>`
      : DS ? `<div class="scrim" data-modal aria-hidden="true"></div><section class="csheet" role="dialog" aria-modal="true" aria-labelledby="dis-title" data-region="sheet"><h2 id="dis-title">${esc(DF.title)}</h2><p>${esc(R.findings[V.dismissForm.finding].claim)}</p>${dform()}</section>`
      : KS ? `${phone ? '<div class="scrim" data-modal aria-hidden="true"></div>' : ""}<section class="csheet keys" role="dialog" aria-modal="${phone}" aria-labelledby="keys-title" data-region="sheet"><div class="keys-head"><h2 id="keys-title">${esc(KS.title)}</h2>${btn(KS.close, "secondary")}</div><dl>${KS.items.map((it) => `<div><dt>${it.keys.map((k) => k === "then" ? `<span>${esc(KS.then)}</span>` : `<kbd>${esc(k)}</kbd>`).join("")}</dt><dd>${esc(it.label)}</dd></div>`).join("")}</dl></section>` : "";
    const modal = !!sheet && !(KS && !phone);

    app.innerHTML = `<div class="shell"${modal ? ' inert aria-hidden="true"' : ""}>${nav}<div class="work">${header}<main>${body}</main></div></div>${sheet}`;
    commitLabels(C);

    // Phone: the bottom bar lives directly under <body> (position: fixed; bottom: 0), so the document scrolls and a full-page capture ends with the bar.
    const navEl = app.querySelector(".nav"), navHome = navEl.parentNode, navNext = navEl.nextSibling, mq = matchMedia("(max-width: 599px)");
    const place = () => { if (mq.matches) document.body.appendChild(navEl); else navHome.insertBefore(navEl, navNext); };
    place(); if (FM && mq.matches) navEl.remove(); if (modal) { navEl.inert = true; navEl.setAttribute("aria-hidden", "true"); } const mq0 = mq.matches; mq.addEventListener("change", (e) => { if (e.matches !== mq0) location.reload(); });
    app.addEventListener("click", (e) => { const a = e.target.closest(".frow"); if (!a) return; const el = document.getElementById(a.getAttribute("href").slice(1)); if (el) { e.preventDefault(); el.focus({ preventScroll: true }); window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 16, behavior: "smooth" }); } });
    root.dataset.regions = [...new Set([...document.querySelectorAll("[data-region]")].map((e) => e.dataset.region))].join(",");
  };

  fetch("../fixture.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((fx) => {
      if (fx.version !== 1 || !fx.data || !fx.data.codeReview) throw new Error("fixture.json has no data.codeReview (version 1)");
      render(fx.data.codeReview);
      settle();
    })
    .catch((e) => {
      app.innerHTML = `<main class="fail" role="alert"><h1>Couldn’t load fixture.json</h1><p>${esc(e.message)}. Serve the project folder over HTTP and open this page from it.</p></main>`;
    });
})();
</script>
</body>
