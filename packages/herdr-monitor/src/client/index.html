<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herdr monitor</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="masthead">
      <h1>Herdr monitor</h1>
      <p id="connection" role="status" aria-live="polite"><strong>Locked</strong></p>
      <button id="lock" type="button" hidden>Lock board</button>
    </header>
    <main id="main">
      <form id="login" method="post" action="/">
        <h2>Open your board</h2>
        <label for="board">Board</label
        ><input
          id="board"
          name="board"
          value="main"
          required
          pattern="[a-z0-9][a-z0-9\-]{0,47}"
          maxlength="48"
          autocomplete="off"
        /><label for="credential">View key</label
        ><input
          id="credential"
          name="credential"
          type="password"
          required
          maxlength="48"
          autocomplete="off"
          aria-describedby="key-help"
        />
        <p id="key-help">Use the view key provided by the board owner.</p>
        <p id="key-error" class="error" hidden></p>
        <button>Open board</button>
      </form>
      <section id="board-view" aria-labelledby="title" hidden>
        <p id="headline"></p>
        <div class="region">
          <div class="region-header">
            <h2 id="title">Board</h2>
            <p id="totals"></p>
          </div>
          <ul id="agents" role="list"></ul>
        </div>
      </section>
    </main>
    <footer>Published snapshots only. This board cannot control sessions.</footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
