packages:
  - scratchpad
  - scripts
  - packages/*

catalog:
  vitest: ^4.1.10

allowBuilds:
  "@ast-grep/cli": true
  esbuild: false
  msgpackr-extract: false
  unrs-resolver: false

overrides:
  # GHSA-8r6m-32jq-jx6q: fast-xml-parser <5.10.1 DOCTYPE entity-expansion reset; keep scoped to 5.x
  "@distilled.cloud/aws>fast-xml-parser": ^5.10.1
  # GHSA-v2hh-gcrm-f6hx and GHSA-7p8r-x3mc-p8w7: fast-uri <=3.1.4 host confusion; keep in 3.x for ajv
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  vitest: "catalog:"
  "@effect/vitest": 4.0.0-beta.107
  "@effect/platform-bun": 4.0.0-beta.107
  "@effect/platform-node": 4.0.0-beta.107
  "@atlaskit/react-ufo": 7.1.0
  effect: 4.0.0-beta.107
  happy-dom: 20.11.2
  markdown-it@<=14.1.1: 14.2.0
  file-type@>=13.0.0 <21.3.1: 21.3.3
  uuid@<11.1.1: 11.1.1
  read-yaml-file@<2.1.0: 2.1.0
  # GHSA-5p4m-2wfm-xmqj: js-yaml <4.3.1 quadratic !!omap resolution
  js-yaml@<4.3.1: 4.3.1
  # GHSA-pm4m-ph32-ghv5: js-yaml 5.0.0–5.2.1 exponential parsing; keep direct consumers on 5.x
  js-yaml@>=5.0.0 <=5.2.1: 5.2.2
  # GHSA-qwww-vcr4-c8h2: react-router 8.0.0–8.2.x RSC action CSRF; keep current consumers on 8.x
  react-router@>=8.0.0 <8.3.0: 8.3.0
  # GHSA-r28c-9q8g-f849 and GHSA-fxqj-rqcc-2cmp: postcss <=8.5.22 source-map path traversal
  postcss@>=8.0.0 <=8.5.22: 8.5.23
  # GHSA-2v37-7h3g-55p8: nanoid <3.3.17 custom generators can loop for a zero size
  nanoid@<3.3.17: 3.3.17
  # GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895: brace-expansion <5.0.9 unbounded expansion DoS
  brace-expansion@>=5.0.0 <5.0.9: 5.0.9
  # GHSA-4cwx-7wf7-3272 and GHSA-8xcm-r25x-g524: undici <8.9.0 cache disclosure/crash and retry desync
  undici@>=8.0.0 <8.9.0: 8.9.0
  yaml: 2.9.0
  linkify-it@<=5.0.1: 5.0.2
  diff@>=6.0.0 <8.0.3: 8.0.3
  svgo@>=4.0.0 <4.0.2: 4.0.2

# Security releases for the pinned overrides above; permit fixes before the age window expires.
minimumReleaseAgeExclude:
  - js-yaml@4.3.1
  - js-yaml@5.2.2
  - nanoid@3.3.17
  - postcss@8.5.23
  - brace-expansion@5.0.9
  - fast-uri@3.1.5
  - undici@8.9.0

patchedDependencies:
  effect@4.0.0-beta.107: patches/effect@4.0.0-beta.107.patch
