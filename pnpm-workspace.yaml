packages:
  - scratchpad
  - scripts
  - packages/*

catalog:
  vitest: ^5.0.3

allowBuilds:
  "@ast-grep/cli": true
  "@google/genai": false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  unrs-resolver: false

overrides:
  # GHSA-8r6m-32jq-jx6q: fast-xml-parser <5.10.1 DOCTYPE entity-expansion reset; keep scoped to 5.x
  "@distilled.cloud/aws>fast-xml-parser": ^5.10.1
  # GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7, GHSA-hrr3-gc8f-f4qj, and the 2026-09 host-confusion advisories: keep patched 3.x for ajv
  fast-uri@>=3.0.0 <3.1.8: 3.1.8
  vitest: "catalog:"
  "@effect/vitest": 4.0.0
  "@effect/platform-bun": 4.0.0
  "@effect/platform-node": 4.0.0
  "@atlaskit/react-ufo": 7.1.0
  effect: 4.0.0
  happy-dom: 20.14.5
  # GHSA-253c-mchw-3w2r: markdown-it <14.3.1; keep prosemirror-markdown on 14.x
  markdown-it@<14.3.1: 14.3.2
  file-type@>=13.0.0 <21.3.1: 21.3.3
  uuid@<11.1.1: 11.1.1
  read-yaml-file@<2.1.0: 2.1.0
  # GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh: bound !!omap and empty merge-source work
  js-yaml@<4.3.2: 4.3.2
  # GHSA-pm4m-ph32-ghv5 and GHSA-r3ph-w7gj-g6xm: js-yaml 5.0.0–5.4.0; keep direct consumers on 5.x
  js-yaml@>=5.0.0 <5.4.1: 5.4.2
  # GHSA-qwww-vcr4-c8h2: react-router 8.0.0–8.2.x RSC action CSRF; keep current consumers on 8.x
  react-router@>=8.0.0 <8.3.0: 8.3.0
  # GHSA-r28c-9q8g-f849 and GHSA-fxqj-rqcc-2cmp: postcss <=8.5.22 source-map path traversal
  postcss@>=8.0.0 <=8.5.22: 8.5.23
  # GHSA-2v37-7h3g-55p8: nanoid <3.3.18 custom generators can loop for a zero size
  nanoid@<3.3.18: 3.3.18
  # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, and GHSA-q2hr-2g5m-vwhr: brace-expansion <5.0.12 expansion DoS
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  # GHSA-4cwx-7wf7-3272, GHSA-8xcm-r25x-g524, and the 2026-09 undici advisories (GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, et al.): undici <8.10.2
  undici@>=8.0.0 <8.10.2: 8.10.2
  yaml: 2.9.1
  linkify-it@<=5.0.1: 5.0.2
  diff@>=6.0.0 <8.0.3: 8.0.3
  # GHSA-j22f-vq7h-c4qm, GHSA-mcm9-63f2-9j32, GHSA-x5rw-q4pp-hg5g, GHSA-hx4r-w6wj-j8fg, GHSA-4q55-j62x-fr9h, GHSA-wf3x-273g-mvxv: devalue <=5.9.2 via astro; keep 5.x
  devalue@>=5.0.0 <5.9.3: 5.9.4
  # GHSA-p98j-92pf-mc4p: dompurify 3.4.13–3.4.15 via packages/review > mermaid; keep 3.x
  dompurify@>=3.4.13 <3.4.16: 3.4.16
  # GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 event-loop DoS (via tailwind and vitest coverage)
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  # GHSA-c8x8-7fp4-3x9w: prosemirror-view <1.42.3 XSS; @atlaskit/editor-prosemirror 9.0.0 pins 1.41.5
  prosemirror-view@<1.42.3: 1.42.6

# Security releases for the pinned overrides above; permit fixes before the age window expires.
minimumReleaseAgeExclude:
  - js-yaml@4.3.2
  - nanoid@3.3.18
  - postcss@8.5.23
  - "@earendil-works/chord@1.0.4"
  - "@earendil-works/pi-ai@1.0.4"
  - "@earendil-works/pi-durable@1.0.4"
  - "@earendil-works/pi-telemetry@1.0.4"

patchedDependencies:
  # Keep the diff renderer compatible with Control Center's strict style-src policy.
  "@pierre/diffs@1.5.1": patches/@pierre__diffs@1.5.1.patch
  # effect-qb 0.22–0.23 target Effect 4.0.0-rc and import the removed effect/unstable/sql paths.
  # Remap them to effect/sql and adapt to the single-key Schema.brand and UnionOptions APIs.
  # control-center-sql ships this patched runtime in dist/vendor/effect-qb until upstream supports Effect 4.0.0.
  "effect-qb@0.22.0": patches/effect-qb@0.22.0.patch

auditConfig:
  ignoreGhsas:
    # GHSA-ch52-4w7c-c8xp (CVE-2026-93748): http-cache-semantics <=4.2.0 has no patched release.
    # Docs-only path: packages/docs > @astrojs/starlight > astro (astro 7.3.5 still needs ^4.2.0).
    # Docs is a static astro build (no adapter, no SSR), so there is no shared server cache to leak.
    # Remove when http-cache-semantics >=4.2.1 ships: https://github.com/kornelski/http-cache-semantics/pull/58
    - GHSA-ch52-4w7c-c8xp
    # GHSA-vfj7-8cjw-p6xm (CVE-2026-93687): braces <=3.0.3 stack-exhaustion DoS; no patched release (latest 3.0.3).
    # Dev-only path: root devDependency @effect/build-utils > micromatch > braces. Build tooling never receives untrusted patterns.
    # Remove when braces >3.0.3 ships or this path goes away.
    - GHSA-vfj7-8cjw-p6xm
    # GHSA-rj75-hqrm-r3gf (2026-10-06): postcss-selector-parser <7.1.6 quadratic flat-selector parsing; only 7.1.6 is patched.
    # Build-time paths only, parsing CSS authored in this repo: codecommit-web > @tailwindcss/typography (pins 6.0.10, also in its
    # latest 0.5.20) and packages/docs > @expressive-code/core > postcss-nested ^6. Forcing 7.x is not safe: 7.0.0 changed how
    # insertions during iteration behave, which both rewriters rely on. Remove when both accept postcss-selector-parser >=7.1.6.
    - GHSA-rj75-hqrm-r3gf
    # GHSA-238p-pmpm-9mq7 (2026-10-06, low): katex <0.18.2 trust checks can be bypassed only by an already-polluted
    # Object.prototype; only 0.18.2+ is patched. Path: packages/review > mermaid > katex; mermaid 12.1.0 (latest) still
    # requires ^0.16.47, and katex 0.x minors are breaking. Remove when mermaid accepts katex >=0.18.2.
    - GHSA-238p-pmpm-9mq7
