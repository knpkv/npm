name: Integration Tests

on:
  # Run twice daily (9-10 AM and 6-7 PM CET)
  schedule:
    - cron: "0 8,17 * * *"

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-confluence:
    name: Confluence CLI Integration Tests
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'knpkv'
    environment: control-center-live
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: "26.7.0"

      - name: Build packages
        run: pnpm --filter @knpkv/agent-skills --filter @knpkv/atlassian-common --filter @knpkv/confluence-api-client --filter @knpkv/confluence-to-markdown build

      - name: Run integration tests
        env:
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_ROOT_PAGE_ID: ${{ vars.CONFLUENCE_ROOT_PAGE_ID }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
        run: pnpm --filter @knpkv/confluence-to-markdown test:integration

  test-jira:
    name: Jira CLI Integration Tests
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'knpkv'
    environment: control-center-live
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: "26.7.0"

      - name: Run integration tests
        env:
          JIRA_INTEGRATION: ${{ secrets.JIRA_EMAIL != '' && secrets.JIRA_API_KEY != '' && '1' || '0' }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://knpkv.atlassian.net' }}
          JIRA_ISSUE_KEY: ${{ vars.JIRA_ISSUE_KEY || 'KAN-1' }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_KEY: ${{ secrets.JIRA_API_KEY }}
        run: pnpm --filter @knpkv/jira-cli test:integration
