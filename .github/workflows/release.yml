# NPM Publishing Workflow
#
# This workflow automates the release process for packages in this monorepo.
# It uses changesets for version management and publishes to npm when ready.
#
# Security: Only runs for repository owner 'knpkv' with minimal required permissions
# Process: Creates release PRs → Merges PRs → Publishes to npm → Creates GitHub releases

name: Release
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    # Security: Only run for repository owner to prevent unauthorized publishing
    if: github.repository_owner == 'knpkv'
    name: Release
    runs-on: ubuntu-latest
    # Room for the npx gate (build, pack, a cold firewall install of every app, their ready waits) and both publish paths.
    timeout-minutes: 45
    permissions:
      contents: write # For creating releases and tags
      id-token: write # For npm provenance
      pull-requests: write # For creating release PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org
      # changelog-github reads commits and pull requests over GraphQL with TOKEN_GITHUB. Making the
      # same kind of call first turns an expired or revoked token into a named failure instead of
      # "Fetched data from GitHub has missing data" halfway through versioning. A read of this
      # public repository proves the token is live, not that it has the write access releases need.
      - name: Check the release token
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          if ! output=$(gh api graphql -f owner="$OWNER" -f name="$NAME" \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id } }' 2>&1); then
            if printf '%s' "$output" | grep -q -e 'Bad credentials' -e 'HTTP 401'; then
              echo "::error title=TOKEN_GITHUB rejected::GitHub answered 401 Bad credentials: TOKEN_GITHUB is expired or revoked. Rotate the secret, then re-run this workflow."
            else
              echo "::error title=Could not reach GitHub::Checking TOKEN_GITHUB failed for another reason; re-run this workflow. gh said: ${output//$'\n'/ }"
            fi
            exit 1
          fi
      # changesets/action publishes only when no changeset is pending; otherwise it
      # versions. A Version Packages merge that lands after newer changesets reached
      # main would then publish nothing (#589). So this step asks npm which versions
      # on main it lacks. When every one was produced by Version Packages (its
      # CHANGELOG has the version's heading), it sets the pending changesets aside
      # and the next step publishes them, then they are restored for versioning.
      # When any is not versioned yet (a new package awaiting its changeset), it
      # warns and leaves the release to the action's usual choice, since a partial
      # publish is unsafe. Asking npm, not this push's diff, keeps a release ready
      # through skipped or failed runs. A failed publish fails its step and the job.
      - name: Prepare versions ready to publish
        id: released
        run: node scripts/check-version-bumps.mjs --prepare-release
      # herdr-hub 0.45.0 shipped against an alchemy-console npm served without `./host`: the workspace links its
      # own copies, so every check passed. When this run will publish, run each app the way users get it right
      # after: the tarballs about to be published, with npm's copies of everything already published
      # (scripts/test-npx-smoke.mjs). It runs workspace code, so it gets no credentials, and the script starts every
      # child with extendEnv: false, so install scripts and apps never see this job's OIDC request variables.
      - name: Run each app as npm will serve it
        if: steps.released.outputs.outstanding == 'true' || (steps.released.outputs.pending != 'true' && steps.released.outputs.propagating != 'true')
        run: |
          pnpm build
          pnpm -r --filter "./packages/*" pack --pack-destination "$RUNNER_TEMP/packs"
          node scripts/test-npx-smoke.mjs --tarballs "$RUNNER_TEMP/packs" --registry-for-published --install-through sfw
      - name: Publish the released versions
        if: steps.released.outputs.outstanding == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.TOKEN_GITHUB }}
          # Build and publish every package whose version is not on npm yet
          publish-script: pnpm changeset:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TOKEN_NPM }}
          HUSKY: 0
      - name: Restore pending changesets
        if: steps.released.outputs.outstanding == 'true'
        run: git checkout HEAD -- .changeset
      # With nothing outstanding this is the action's usual choice: version pending changesets, or
      # publish when none are pending. After a release it only versions what is pending, and while npm's
      # metadata still lags a publish it only versions, so it cannot try to republish.
      - name: Create Release Pull Request or Publish
        id: changesets
        if: steps.released.outputs.pending == 'true' || (steps.released.outputs.outstanding != 'true' && steps.released.outputs.propagating != 'true')
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.TOKEN_GITHUB }}
          # Version packages based on changeset files
          version-script: pnpm changeset:version
          # Build and publish packages to npm registry
          publish-script: pnpm changeset:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TOKEN_NPM }}
          HUSKY: 0
      # Review bots skip pull requests labelled release, so the Version Packages PR gets the label. The
      # action sets pr-number only when it opened or updated that PR. --force creates the label
      # or leaves an existing one as configured here.
      - name: Label the release pull request
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ steps.changesets.outputs.pr-number }}
        run: |
          gh label create release --force --color ededed --description "Version Packages pull request"
          gh pr edit "$PULL_REQUEST" --add-label release
