# NPM Publishing Workflow
#
# This workflow automates the release process for packages in this monorepo.
# It uses changesets for version management and publishes to npm when ready.
#
# Security: Only runs for repository owner 'knpkv' with minimal required permissions
# Process: Creates release PRs → Merges PRs → Publishes to npm → Creates GitHub releases

name: Release
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    # Security: Only run for repository owner to prevent unauthorized publishing
    if: github.repository_owner == 'knpkv'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # For creating releases and tags
      id-token: write # For npm provenance
      pull-requests: write # For creating release PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org
      # changesets/action publishes only when no changeset is pending; otherwise it
      # versions. A Version Packages merge that lands after newer changesets reached
      # main would then publish nothing (#589). So publish first with the pending
      # changesets set aside, then version them in a second pass. A failed publish
      # fails this step and the job.
      - name: Set pending changesets aside
        id: pending
        run: |
          shopt -s nullglob
          pending=()
          for file in .changeset/*.md; do
            [[ "${file}" == .changeset/README.md ]] || pending+=("${file}")
          done
          echo "count=${#pending[@]}" >> "${GITHUB_OUTPUT}"
          if (( ${#pending[@]} > 0 )); then
            mkdir -p "${RUNNER_TEMP}/pending-changesets"
            mv -- "${pending[@]}" "${RUNNER_TEMP}/pending-changesets/"
          fi
      - name: Publish versions already on main
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.TOKEN_GITHUB }}
          # Build and publish every package whose version is not on npm yet
          publish-script: pnpm changeset:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TOKEN_NPM }}
          HUSKY: 0
      - name: Restore pending changesets
        if: steps.pending.outputs.count != '0'
        run: git checkout HEAD -- .changeset
      - name: Create or update the Version Packages pull request
        if: steps.pending.outputs.count != '0'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.TOKEN_GITHUB }}
          # Version packages based on changeset files
          version-script: pnpm changeset:version
          # Changesets are pending here, so this only versions; it tells the PR that merging publishes
          publish-script: pnpm changeset:publish
        env:
          HUSKY: 0
