name: Snapshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  snapshot:
    if: github.repository_owner == 'knpkv'
    name: Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
      - name: Build
        run: pnpm build

  publish:
    if: github.repository_owner == 'knpkv' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    name: Publish snapshot
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
      - name: Build
        run: pnpm build
      - name: Publish
        run: sfw pnpm dlx pkg-pr-new@0.0.87 publish --pnpm --comment=off ./packages/*
