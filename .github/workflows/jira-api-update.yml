name: Jira API Spec Check

on:
  # Daily at 6 AM UTC (offset by 30 min from Confluence check)
  schedule:
    - cron: "30 6 * * *"

  # Manual trigger
  workflow_dispatch:

# The PR is pushed and opened with the automation App's token, so CI runs on it
# (GITHUB_TOKEN-created PRs trigger no workflows); GITHUB_TOKEN only checks out.
permissions:
  contents: read

concurrency:
  group: jira-api-spec-update
  cancel-in-progress: true

jobs:
  check-spec:
    name: Check Jira API Spec Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      updated: ${{ steps.regenerate.outputs.updated }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: "26.7.0"

      - name: Regenerate and detect spec updates
        id: regenerate
        run: |
          pnpm --filter @knpkv/jira-api-client regenerate
          # Open a PR only for upstream spec changes; regenerated-code-only diffs are
          # generator churn and must not displace the published contract.
          if git diff --quiet -- packages/jira-api-client/.specs; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Check generated client
        if: steps.regenerate.outputs.updated == 'true'
        run: pnpm --filter @knpkv/jira-api-client check

      - name: Build client and consumers
        if: steps.regenerate.outputs.updated == 'true'
        run: pnpm --filter @knpkv/jira-cli... --filter @knpkv/jira-clockify... build

      # @knpkv/jira-clockify ships an nvim plugin whose specs run under
      # `nvim --headless`; its test suite fails in CI when the binary is absent.
      - name: Install neovim for nvim plugin specs
        if: steps.regenerate.outputs.updated == 'true'
        uses: ./.github/actions/setup-neovim

      - name: Run client and consumer tests
        if: steps.regenerate.outputs.updated == 'true'
        run: |
          pnpm --filter @knpkv/jira-api-client test
          pnpm --filter @knpkv/jira-cli test
          pnpm --filter @knpkv/jira-clockify test

      - name: Create changeset
        if: steps.regenerate.outputs.updated == 'true'
        run: |
          mkdir -p .changeset
          cat > .changeset/jira-api-spec-update-${GITHUB_RUN_ID}.md <<'CHANGESET'
          ---
          "@knpkv/jira-api-client": minor
          "@knpkv/jira-cli": patch
          "@knpkv/jira-clockify": patch
          ---

          Update the generated Schema-backed Jira API client.
          CHANGESET

      - name: Export update patch
        if: steps.regenerate.outputs.updated == 'true'
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/openapi-update.patch"

      - name: Upload update patch
        if: steps.regenerate.outputs.updated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-update-patch
          path: ${{ runner.temp }}/openapi-update.patch
          if-no-files-found: error
          retention-days: 1

  # Generated code from the upstream spec ran in check-spec, so the App key never
  # enters that job: this one only applies the patch and opens the PR.
  open-pr:
    name: Open Jira API Update PR
    needs: check-spec
    if: needs.check-spec.outputs.updated == 'true' && github.ref == 'refs/heads/main' && github.repository_owner == 'knpkv'
    environment: automation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download update patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-update-patch
          path: ${{ runner.temp }}/openapi-update

      - name: Apply update patch
        run: git apply "$RUNNER_TEMP/openapi-update/openapi-update.patch"

      - name: Create automation App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        # The husky pre-commit gate needs the effect-upstream remote and a full
        # local toolchain; this workflow already ran the focused build and tests.
        env:
          HUSKY: "0"
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(jira-api-client): update OpenAPI client"
          title: "chore(jira-api-client): update OpenAPI client"
          body: |
            Automated update of the Jira OpenAPI specification and generated Effect client.

            The workflow compared the complete upstream document, regenerated the
            Schema-backed client, and built and tested both downstream consumers.

            Review:
            - `packages/jira-api-client/.specs/jira-v3.json`
            - `packages/jira-api-client/.specs/jira-v3.patch.json`
            - `packages/jira-api-client/src/JiraApiClient.ts`
            - `packages/jira-api-client/src/generated/JiraApi.ts`

            Review the published generated exports before merging. The client
            changeset defaults to minor; use major for removed exports or
            incompatible schemas in this stable package. Patch is appropriate
            only when the generated public contract is unchanged.
          branch: chore/jira-api-spec-update
          delete-branch: true
          labels: |
            dependencies
            automated
