name: Clockify API Spec Check

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# The PR is pushed and opened with the automation App's token, so CI runs on it
# (GITHUB_TOKEN-created PRs trigger no workflows); GITHUB_TOKEN only checks out.
permissions:
  contents: read

concurrency:
  group: clockify-api-spec-update
  cancel-in-progress: true

jobs:
  check-spec:
    name: Check Clockify API Spec Updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      bump: ${{ steps.changeset.outputs.bump }}
      release-notes: ${{ steps.changeset.outputs.release-notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: "26.7.0"

      - name: Regenerate client
        run: pnpm --filter @knpkv/clockify-api-client regenerate

      # Open a PR only for upstream spec changes; regenerated-code-only diffs are
      # generator churn and must not displace the published contract.
      - name: Detect spec changes
        id: check
        shell: bash
        run: |
          if git diff --quiet -- packages/clockify-api-client/.specs; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build generated client and consumers
        if: steps.check.outputs.updated == 'true'
        run: pnpm --filter @knpkv/jira-clockify... build

      # @knpkv/jira-clockify ships an nvim plugin whose specs run under
      # `nvim --headless`; its test suite fails in CI when the binary is absent.
      - name: Install neovim for nvim plugin specs
        if: steps.check.outputs.updated == 'true'
        uses: ./.github/actions/setup-neovim

      - name: Run generated-client tests
        if: steps.check.outputs.updated == 'true'
        run: |
          pnpm --filter @knpkv/clockify-api-client check
          pnpm --filter @knpkv/clockify-api-client test
          pnpm --filter @knpkv/jira-clockify test

      # The release follows the spec diff: removed or incompatible contract is major.
      - name: Create changeset
        id: changeset
        if: steps.check.outputs.updated == 'true'
        run: |
          node scripts/openapi-changeset.ts \
            --package @knpkv/clockify-api-client \
            --spec packages/clockify-api-client/.specs/clockify-v1.json \
            --summary "Update the generated Clockify API client from the latest OpenAPI specification." \
            --out ".changeset/clockify-api-spec-update-${GITHUB_RUN_ID}.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Export update patch
        if: steps.check.outputs.updated == 'true'
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/openapi-update.patch"

      - name: Upload update patch
        if: steps.check.outputs.updated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-update-patch
          path: ${{ runner.temp }}/openapi-update.patch
          if-no-files-found: error
          retention-days: 1

  # Generated code from the upstream spec ran in check-spec, so the App key never
  # enters that job: this one only applies the patch and opens the PR.
  open-pr:
    name: Open Clockify API Update PR
    needs: check-spec
    if: needs.check-spec.outputs.updated == 'true' && github.ref == 'refs/heads/main' && github.repository_owner == 'knpkv'
    environment: automation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download update patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-update-patch
          path: ${{ runner.temp }}/openapi-update

      - name: Apply update patch
        run: git apply "$RUNNER_TEMP/openapi-update/openapi-update.patch"

      - name: Create automation App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        # The husky pre-commit gate needs the effect-upstream remote and a full
        # local toolchain; this workflow already ran the focused build and tests.
        env:
          HUSKY: "0"
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(clockify-api-client): update OpenAPI client"
          title: "chore(clockify-api-client): update OpenAPI client"
          body: |
            Automated update from Clockify's current OpenAPI document.

            The workflow fetched and compared the raw specification, applied
            the committed JSON Patch, regenerated the Schema-backed Effect
            client, built its jira-clockify consumer, and ran both test suites.

            ${{ needs.check-spec.outputs.release-notes }}

            The release comes from a diff of the previous and updated specs
            (`scripts/openapi-spec-diff.ts`). Review the published `./generated`
            exports before merging: raise the changeset if the diff missed a
            breaking change, and lower it to patch only when the generated
            public contract is unchanged.

            Review these files closely:
            - `packages/clockify-api-client/.specs/clockify-v1.json`
            - `packages/clockify-api-client/src/generated/ClockifyApi.ts`
            - `packages/clockify-api-client/.specs/clockify-v1.patch.json`
          branch: chore/clockify-api-spec-update
          delete-branch: true
          labels: |
            dependencies
            automated
