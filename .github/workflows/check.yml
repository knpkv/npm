name: Check
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to a pull request supersedes its running checks. Main is never cancelled: pushes there
# land every few minutes while a full run takes longer, so cancelling left main with no completed run.
# Main runs queue instead (GitHub keeps one running and the newest pending).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
      - run: pnpm format

  lint-static:
    name: Lint static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Changed Effect diagnostics start one language-service process per changed file (about ten
    # seconds per four-file wave on hosted runners), so repository-wide changes need the headroom.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout credentials were not persisted
        shell: bash
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo "actions/checkout persisted an HTTP authorization header"
            exit 1
          fi
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
      - name: Configure canonical Effect remote
        run: git remote add effect-upstream https://github.com/Effect-TS/effect.git
      # Workspace packages publish their types from `dist`, so without a build every `@knpkv/*`
      # import resolves to `any`, and the Effect diagnostics then report requirements they cannot
      # see through — and reject the suppressions for the rules that only fire once types are real.
      # Linting unbuilt lints a program that does not exist.
      - run: pnpm check
      - run: pnpm lint:static
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  changeset-coverage:
    name: Changeset coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Builds the workspace, then type-checks every changed public surface. A PR touching several
    # publishable packages needs ~4 min for the coverage step alone on top of `pnpm check`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout credentials were not persisted
        shell: bash
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo "actions/checkout persisted an HTTP authorization header"
            exit 1
          fi
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
      - name: Configure canonical Effect remote
        run: git remote add effect-upstream https://github.com/Effect-TS/effect.git
      # Release publishes every public version not yet on npm, so only the Version Packages
      # pull request may move an existing package's version.
      - name: Check version bumps
        run: node scripts/check-version-bumps.mjs
      # The checker resolves workspace types through built package outputs.
      - run: pnpm check
      - run: pnpm lint:changeset-coverage
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  lint:
    name: Lint
    needs: [lint-static, changeset-coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: Require both lint partitions
        env:
          LINT_STATIC_RESULT: ${{ needs.lint-static.result }}
          CHANGESET_COVERAGE_RESULT: ${{ needs.changeset-coverage.result }}
        run: |
          set -euo pipefail
          if [ "${LINT_STATIC_RESULT:-}" != "success" ] || [ "${CHANGESET_COVERAGE_RESULT:-}" != "success" ]; then
            echo "Both lint partitions must succeed"
            exit 1
          fi

  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
      - run: pnpm run audit

  types:
    name: Types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
      - run: pnpm build
      - run: pnpm check

  test-unit:
    name: Test unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The vitest suite alone; packed-package checks run in test-pack so neither
    # pushes the other past its timeout.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
          bun-version: 1.3.14
      - name: Verify runtime pins
        run: |
          test "$(node --version)" = "v26.7.0"
          test "$(bun --version)" = "1.3.14"
      # @knpkv/jira-clockify ships an nvim plugin whose specs run under
      # `nvim --headless`. Without the binary those specs skip, and the plugin's
      # single-flight and cache invariants would have no automated cover.
      - name: Install neovim for nvim plugin specs
        timeout-minutes: 5
        uses: ./.github/actions/setup-neovim
      - run: pnpm build
      - run: pnpm test:unit

  test-pack:
    name: Test pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
          bun-version: 1.3.14
      - name: Verify runtime pins
        run: |
          test "$(node --version)" = "v26.7.0"
          test "$(bun --version)" = "1.3.14"
      - run: pnpm build
      - run: pnpm test:pack

  test:
    name: Test
    needs: [test-unit, test-pack]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: Require both test partitions
        env:
          TEST_UNIT_RESULT: ${{ needs.test-unit.result }}
          TEST_PACK_RESULT: ${{ needs.test-pack.result }}
        run: |
          set -euo pipefail
          if [ "${TEST_UNIT_RESULT:-}" != "success" ] || [ "${TEST_PACK_RESULT:-}" != "success" ]; then
            echo "Both test partitions must succeed (unit: ${TEST_UNIT_RESULT:-missing}, pack: ${TEST_PACK_RESULT:-missing})"
            exit 1
          fi

  edge-runtimes:
    name: Edge runtimes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install edge runtimes and dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
          bun-version: 1.3.14
      - name: Verify runtime pins
        run: |
          test "$(node --version)" = "v26.7.0"
          test "$(bun --version)" = "1.3.14"
      - name: Build CodeCommit runtime graph
        run: pnpm --filter @knpkv/codecommit... build
      - name: Test Node/Bun runtime boundaries on Ubuntu 26.04
        run: pnpm exec vitest run --configLoader native packages/codecommit/test/bin.test.ts packages/codecommit-core/test/ChildEnv.test.ts

  browser-suite:
    name: Browser (${{ matrix.package }})
    runs-on: ubuntu-latest
    # One leg per package with a test:browser script, so a slow suite cannot cancel the rest.
    # GitHub-hosted storage is declared, not attested. The timing-noise quarantine
    # and rerun policy is documented in .github/workflows/README.md.
    env:
      CONTROL_CENTER_BENCHMARK_STORAGE_CLASS: local-ssd
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - agent-usage
          - codecommit-web
          - control-center
          - herdr-connect
          - herdr-monitor
          - herdr-work
          - jcf-web
          - review
          - rly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 26.7.0
      - name: Install bounded Chromium runtime
        run: pnpm --filter @knpkv/rly exec playwright install --with-deps chromium
      - name: Build the package's workspace dependencies
        run: pnpm --filter "@knpkv/${{ matrix.package }}^..." --sort --if-present run build
      - name: Test the package's browser suite
        run: pnpm --filter "@knpkv/${{ matrix.package }}" run test:browser
      - name: Validate Control Center large-fixture contracts
        if: ${{ matrix.package == 'control-center' }}
        run: pnpm --filter @knpkv/control-center benchmark:contracts
      - name: Validate Control Center runtime benchmark evidence
        if: ${{ matrix.package == 'control-center' }}
        run: pnpm --filter @knpkv/control-center benchmark:validate-runtime
      - name: Upload Control Center runtime benchmark evidence
        if: ${{ always() && matrix.package == 'control-center' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: control-center-runtime-benchmark
          path: packages/control-center/test-results/control-center/runtime-benchmark.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser
    needs: [browser-suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: Require every browser suite
        env:
          BROWSER_SUITE_RESULT: ${{ needs.browser-suite.result }}
        run: |
          set -euo pipefail
          if [ "${BROWSER_SUITE_RESULT:-}" != "success" ]; then
            echo "Every browser suite must succeed (matrix result: ${BROWSER_SUITE_RESULT:-missing})"
            exit 1
          fi
