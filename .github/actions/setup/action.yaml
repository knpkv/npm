name: Setup
description: Perform standard setup and install dependencies using pnpm.
inputs:
  node-version:
    description: The version of Node.js to install
    required: false
  registry-url:
    description: Optional npm registry URL used to configure publishing authentication
    required: false
  deno-version:
    description: The version of Deno to install
    required: false
  bun-version:
    description: The version of Bun to install
    required: false

runs:
  using: composite
  steps:
    # One sha-pinned Socket Firewall binary per runner OS and architecture. A runner with no pinned
    # binary fails here: there is no unfirewalled or unpinned install path.
    - name: Install Socket Firewall
      shell: bash
      env:
        SOCKET_FIREWALL_RELEASE: https://github.com/SocketDev/sfw-free/releases/download/v1.15.0
        RUNNER_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
      run: |
        case "${RUNNER_PLATFORM}" in
          Linux-X64) asset=sfw-free-linux-x86_64 sha256=c80371910a808ea5c68916c48e5451716a91ca411cf5e422fdbd8119729b742c binary=sfw ;;
          Linux-ARM64) asset=sfw-free-linux-arm64 sha256=55671fa409ef3d40fcee66acbba4d7acfff8a5332d349ad47cca809ebf473cd0 binary=sfw ;;
          macOS-ARM64) asset=sfw-free-macos-arm64 sha256=fa473291b8b76220f4b636cf655e8a4dc03332145bdea3acfd9bc96887b2da20 binary=sfw ;;
          macOS-X64) asset=sfw-free-macos-x86_64 sha256=07cfcc9805812130ebca07f73c51c2cd9c0181b394f25be4c969c0d31c9dc26f binary=sfw ;;
          Windows-X64) asset=sfw-free-windows-x86_64.exe sha256=029882f10e1020c96353b184ec0dba7da853e0f6d35131ca930515a7e61e89e6 binary=sfw.exe ;;
          *)
            echo "::error title=No pinned Socket Firewall::No sha-pinned Socket Firewall binary for ${RUNNER_PLATFORM}."
            exit 1
            ;;
        esac
        install_directory="${RUNNER_TEMP}/socket-firewall"
        binary_path="${install_directory}/${binary}"
        mkdir -p "${install_directory}"
        curl --fail --location --retry 4 --retry-all-errors \
          --output "${binary_path}" "${SOCKET_FIREWALL_RELEASE}/${asset}"
        if command -v sha256sum >/dev/null; then
          printf '%s  %s\n' "${sha256}" "${binary_path}" | sha256sum --check --strict
        else
          printf '%s  %s\n' "${sha256}" "${binary_path}" | shasum -a 256 --check --strict
        fi
        chmod +x "${binary_path}"
        echo "${install_directory}" >> "${GITHUB_PATH}"
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Install node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ inputs.node-version != '' }}
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
    - name: Install deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      if: ${{ inputs.deno-version != '' }}
      with:
        deno-version: ${{ inputs.deno-version }}
    - name: Install bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: ${{ inputs.bun-version != '' }}
      with:
        bun-version: ${{ inputs.bun-version }}
    # Socket Firewall can crash mid-install ("TypeError: fetch failed") and still exit 0, leaving a partial
    # node_modules that later steps fail on (`Command "playwright" not found`). An offline install afterwards
    # succeeds only when every package the lockfile names is in place, so it turns that into a retry here.
    # A firewall refusal fails every attempt and so still fails the step.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if sfw pnpm install --frozen-lockfile && pnpm install --frozen-lockfile --offline; then
            exit 0
          fi
          echo "::warning title=Dependency install incomplete::Attempt $attempt of 3 did not install every package."
        done
        echo "::error title=Dependency install failed::pnpm install through Socket Firewall did not complete in 3 attempts."
        exit 1
