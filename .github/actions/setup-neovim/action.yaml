name: Setup Neovim
description: >-
  Install a pinned, checksum-verified Neovim release for the jira-clockify nvim
  plugin specs. Replaces apt, whose mirrors stalled CI jobs past their budget.
runs:
  using: composite
  steps:
    - name: Install Neovim
      shell: bash
      env:
        NEOVIM_SHA256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
        NEOVIM_URL: https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
      run: |
        install_directory="${RUNNER_TEMP}/neovim"
        archive_path="${RUNNER_TEMP}/nvim-linux-x86_64.tar.gz"
        mkdir -p "${install_directory}"
        # Each attempt is bounded so a stalled connection retries instead of
        # holding the job until its timeout.
        curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
          --connect-timeout 20 --max-time 120 \
          --output "${archive_path}" "${NEOVIM_URL}"
        printf '%s  %s\n' "${NEOVIM_SHA256}" "${archive_path}" \
          | sha256sum --check --strict
        tar --extract --gzip --file "${archive_path}" \
          --directory "${install_directory}" --strip-components 1
        echo "${install_directory}/bin" >> "${GITHUB_PATH}"
        "${install_directory}/bin/nvim" --version | head -n 1
